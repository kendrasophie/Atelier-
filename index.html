/* motor de rondas: cada ronda es una función async que devuelve true/false */
async function rounds(box,id,list,intro,head){
  let ok=0;const res=[];
  for(let i=0;i<list.length;i++){
    box.innerHTML=`${head?head():""}${intro?`<p class="note center">${intro}</p>`:""}${dots(list.length,i,res)}<div id="rbody" class="rbody"></div>`;
    if(UI.cur)UI.cur.t0=performance.now();
    const r=await list[i]($("rbody"),i);res.push(r);if(r)ok++;
  }
  UI.gameEnd(id,ok,list.length);
}

/* calculadora del kiosco: abrirla está permitido, pero el cálculo mental paga un premio extra */
function kCalc(el){
  let used=false,cur="0",acc=null,op=null,fresh=true;
  const w=document.createElement("details");w.className="kcalc";
  w.innerHTML=`<summary>🧮 Usar la calculadora <small>(si la abrís, no hay premio de cálculo mental)</small></summary><div class="kc-screen"><small class="kc-op"></small><b class="kc-num">0</b></div><div class="kc-keys">${["7","8","9","÷","4","5","6","×","1","2","3","−","C","0","=","+"].map(k=>`<button type="button" data-k="${k}" class="${/\d/.test(k)?"":"op"} ${k==="="?"eq":""}">${k}</button>`).join("")}</div>`;
  el.appendChild(w);
  w.addEventListener("toggle",()=>{if(w.open&&!used){used=true;el.querySelectorAll(".kmental").forEach(x=>x.classList.add("off"));FX.toast("🧮 Calculadora abierta: esta vez no hay premio de cálculo mental")}});
  const fmt=v=>{const n=Number(v);return isFinite(n)?n.toLocaleString("es-AR",{maximumFractionDigits:2}):"Error"};
  const calc=(a,b,o)=>o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:o==="÷"?(b===0?NaN:a/b):b;
  const show=()=>{w.querySelector(".kc-num").textContent=fmt(cur);w.querySelector(".kc-op").textContent=acc!=null&&op?`${fmt(acc)} ${op}`:""};
  w.querySelectorAll(".kc-keys button").forEach(b=>b.onclick=()=>{const k=b.dataset.k;FX.pop();
    if(/\d/.test(k)){cur=fresh||cur==="0"?k:(cur.length<10?cur+k:cur);fresh=false}
    else if(k==="C"){cur="0";acc=null;op=null;fresh=true}
    else if(k==="="){if(op!=null&&acc!=null){cur=String(calc(acc,+cur,op));acc=null;op=null;fresh=true}}
    else{if(op!=null&&acc!=null&&!fresh)acc=calc(acc,+cur,op);else if(acc==null||!fresh)acc=+cur;op=k;fresh=true;cur=String(acc)}
    show()});
  return {used:()=>used};
}

const kBonus=c=>c.used()?null:{c:roundPay(),t:"🧠 ¡Cálculo mental! Premio extra"};

/* ================= 4. ÁBACO MÁGICO (soroban) ================= */
/* dibujo estático de un soroban: vals = dígito de cada varilla (izquierda → derecha) */
function sorobanSVG(vals,w=220,mark){
  const n=vals.length,W=40*n+20;
  const rods=vals.map((d,i)=>{const x=30+i*40;const up=d>=5,lo=d%5;const hl=mark&&mark[i];
    const bead=(y,on,col)=>`<ellipse cx="${x}" cy="${y}" rx="15" ry="8" fill="${col}" stroke="${shade(col,.6)}" stroke-width="1.5" opacity="${on?1:.85}"/>`;
    let s=`<rect x="${x-1.5}" y="12" width="3" height="136" fill="#a16207"/>`;
    s+=bead(up?50:24,up,up?"#ec4899":"#f9a8d4");
    for(let k=0;k<4;k++){const on=k<lo;const y=on?72+k*17:80+k*17+(4-lo)*0+18;s+=bead(on?72+k*17:94+k*17-((lo)*0),on,on?"#7c3aed":"#c4b5fd")}
    if(hl)s+=`<rect x="${x-19}" y="8" width="38" height="144" rx="8" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4 3"/>`;
    s+=`<text x="${x}" y="166" text-anchor="middle" font-size="11" font-weight="800" fill="#6b7280">${["UM","C","D","U"].slice(-n)[i]}</text><text x="${x}" y="182" text-anchor="middle" font-size="15" font-weight="900" fill="#1e1b4b">${d}</text>`;
    return s}).join("");
  return `<svg width="${w}" viewBox="0 0 ${W} 190" aria-hidden="true"><rect x="4" y="4" width="${W-8}" height="150" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="4"/><rect x="4" y="58" width="${W-8}" height="6" fill="#92400e"/>${rods}</svg>`;
}
function abacoLesson(onEnd){
  const S=[
    ["¿Cómo es un ábaco japonés?",`${sorobanSVG([0,0,0])}<p>Cada <b>varilla</b> es una columna: unidades (U), decenas (D), centenas (C)…</p><p>Arriba de la barra hay <b>1 cuenta rosa que vale 5</b>. Abajo hay <b>4 cuentas violetas que valen 1</b> cada una.</p><p>Solo cuentan las que <b>tocan la barra del medio</b>.</p>`],
    ["Cómo se marca un número",`<div class="lsrow">${sorobanSVG([0,0,7],150)}${sorobanSVG([0,2,3],150)}</div><p><b>7</b> = la cuenta de 5 + 2 cuentas de 1.</p><p><b>23</b> = 2 cuentas en las decenas y 3 en las unidades.</p>`],
    ["Los «amigos del 5»",`<div class="lsrow">${sorobanSVG([3],80,[1])}<span class="larrow">+4 →</span>${sorobanSVG([7],80,[1])}</div><p>Tenés 3 y querés sumar 4, pero abajo queda <b>1 sola cuenta libre</b>.</p><p>Truco: <b>4 = 5 − 1</b>. Bajás la cuenta de 5 y sacás 1. ¡Quedó 7!</p><p class="pairs">Amigos del 5: <b>1 y 4</b> · <b>2 y 3</b></p>`],
    ["Los «amigos del 10»",`<div class="lsrow">${sorobanSVG([0,7],110,[0,1])}<span class="larrow">+8 →</span>${sorobanSVG([1,5],110,[1,1])}</div><p>Tenés 7 y querés sumar 8. En las unidades no entra.</p><p>Truco: <b>8 = 10 − 2</b>. Sumás 1 en las decenas (vale 10) y sacás 2 de las unidades. ¡Quedó 15!</p><p class="pairs">Amigos del 10: <b>1 y 9</b> · <b>2 y 8</b> · <b>3 y 7</b> · <b>4 y 6</b> · <b>5 y 5</b></p>`],
    ["Anzan: el ábaco en la mente",`${sorobanSVG([0,4,2])}<p>Cuando practicás mucho, podés <b>imaginar</b> el ábaco y mover las cuentas en la cabeza. Así se hace cálculo mental súper rápido.</p><p>En el juego vas a ver números que pasan rápido: imaginá las cuentas y sumalos.</p>`]
  ];let i=0;
  const draw=()=>{UI.modal(`<p class="stepn">Aprender el ábaco · ${i+1} de ${S.length}</p><h2 class="mtitle">${S[i][0]}</h2><div class="lesson">${S[i][1]}</div><div class="mactions">${i?`<button class="btn" type="button" id="lb">← Atrás</button>`:""}<button class="btn primary" type="button" id="ln">${i<S.length-1?"Siguiente →":"¡A jugar!"}</button></div>`,true);
    if($("lb"))$("lb").onclick=()=>{i--;draw()};$("ln").onclick=()=>{if(i<S.length-1){i++;draw()}else{UI.close();G.P.stats.abacoTut=1;G.save();onEnd&&onEnd()}}};
  draw();
}
GAMEFN.abaco=function(box,L){
  const lessonBtn=()=>`<p class="center"><button class="btn small" type="button" onclick="abacoLesson()">📘 ¿Cómo se usa el ábaco?</button></p>`;
  const start=()=>startAbaco(box,L,lessonBtn);
  if(!G.P.stats.abacoTut)abacoLesson(start);else start();
};
function startAbaco(box,L,lessonBtn){
  const RODS=L>=3?5:4;
  function soroban(el){
    const st=Array.from({length:RODS},()=>({h:0,e:0}));
    el.innerHTML=`<div class="soroban" role="group" aria-label="Ábaco">${st.map((_,r)=>`<div class="rod" data-r="${r}"><button class="bead h" type="button" aria-label="Cuenta de 5"></button><div class="beam"></div>${[0,1,2,3].map(k=>`<button class="bead e" data-k="${k}" type="button" aria-label="Cuenta de 1"></button>`).join("")}<small>${["UM","C","D","U","DM"].slice(-RODS)[r]||""}</small></div>`).join("")}</div><p class="abval">Valor: <b id="abv">0</b></p>`;
    const labels=RODS===5?["DM","UM","C","D","U"]:["UM","C","D","U"];el.querySelectorAll(".rod small").forEach((s,i)=>s.textContent=labels[i]);
    const val=()=>st.reduce((a,r)=>a*10+r.h*5+r.e,0);
    const paint=()=>{el.querySelectorAll(".rod").forEach((rd,r)=>{rd.querySelector(".h").classList.toggle("on",st[r].h===1);rd.querySelectorAll(".e").forEach((b,k)=>b.classList.toggle("on",k<st[r].e))});$("abv").textContent=num(val())};
    el.querySelectorAll(".rod").forEach((rd,r)=>{rd.querySelector(".h").onclick=()=>{st[r].h^=1;FX.pop();paint()};rd.querySelectorAll(".e").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st[r].e=st[r].e===k+1?k:k+1;FX.pop();paint()})});
    paint();return {val,set:n=>{const ds=String(n).padStart(RODS,"0").slice(-RODS).split("").map(Number);ds.forEach((d,i)=>{st[i].h=d>=5?1:0;st[i].e=d%5});paint()}};
  }
  const show=async el=>{const n=rnd(10,L>=3?9999:L>=2?999:99);el.innerHTML=`<h3 class="qtext">Mostrá el número <b>${num(n)}</b> en el ábaco</h3><p class="note">La cuenta de arriba vale 5; cada una de abajo vale 1.</p><div id="ab"></div>`;const s=soroban($("ab"));await checkBtn(el,"Listo",()=>true);return feedback(el,s.val()===n,s.val()===n?"":`Mostraste ${num(s.val())}. ${num(n)} = ${String(n).split("").map((d,i,a)=>d+"×"+num(10**(a.length-1-i))).join(" + ")}.`)};
  const add=async el=>{const a=rnd(12,L>=3?5000:L>=2?500:60),b=rnd(3,L>=2?99:9);el.innerHTML=`<h3 class="qtext">En el ábaco está ${num(a)}. Sumale <b>${b}</b>.</h3><p class="note">Si no te alcanzan las cuentas, usá los amigos: del 5 (+4 = +5 −1) o del 10 (+8 = +10 −2). Tocá 📘 si no te acordás.</p><div id="ab"></div>`;const s=soroban($("ab"));s.set(a);await checkBtn(el,"Listo",()=>true);return feedback(el,s.val()===a+b,`${num(a)} + ${b} = ${num(a+b)}.`)};
  const flash=async el=>{const n=Math.min(7,3+Math.floor(L/2)),mx=L>=4?99:L>=2?20:9,speed=Math.max(500,1300-L*120);const ns=Array.from({length:n},()=>rnd(1,mx));const sum=ns.reduce((a,b)=>a+b,0);
    el.innerHTML=`<h3 class="qtext">Anzan relámpago: imaginá el ábaco y sumá los ${n} números que van a aparecer.</h3><div class="flashnum" id="fn">¿Lista?</div>`;
    await new Promise(r=>setTimeout(r,900));for(const x of ns){$("fn").textContent=x;FX.pop();await new Promise(r=>setTimeout(r,speed));$("fn").textContent="";await new Promise(r=>setTimeout(r,150))}
    $("fn").textContent="?";const opts=shuffle([sum,...near(sum,3)]);el.insertAdjacentHTML("beforeend",`<div class="qopts four">${opts.map(o=>`<button class="qopt" type="button">${o}</button>`).join("")}</div>`);
    const a=await new Promise(r=>el.querySelectorAll(".qopt").forEach(b=>b.onclick=()=>r(+b.textContent)));return feedback(el,a===sum,`Eran ${ns.join(" + ")} = ${sum}.`)};
  rounds(box,"abaco",L>=2?[show,add,flash,add,flash,show,qRound("mate"),flash]:[show,show,add,show,add,flash,qRound("mate"),add],null,lessonBtn);
};

function robotLibre(box,L){
  const N=Math.min(7,5+Math.floor((L-1)/2));
  function maze(){
    for(let tries=0;tries<200;tries++){
      const walls=new Set();const nw=Math.floor(N*N*(0.12+Math.min(L,6)*0.02));for(let i=0;i<nw;i++)walls.add(rnd(0,N-1)+","+rnd(0,N-1));
      const s=[0,N-1],goal=[rnd(Math.floor(N/2),N-1),rnd(0,Math.floor(N/2))];walls.delete(s+"");walls.delete(goal+"");
      const q=[[...s]],seen={[s+""]:0};while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,k=nx+","+ny;if(nx<0||ny<0||nx>=N||ny>=N||walls.has(k)||k in seen)continue;seen[k]=seen[x+","+y]+1;q.push([nx,ny])}}
      if(seen[goal+""]>=N-1){
        // menor cantidad de bloques (avanzar y girar) para llegar: búsqueda sobre (x, y, dirección)
        const D=[[0,-1],[1,0],[0,1],[-1,0]];const st=[[s[0],s[1],0]];const c={[s+",0"]:0};let best=99;
        while(st.length){const [x,y,dd]=st.shift();const k=c[x+","+y+","+dd];if(x===goal[0]&&y===goal[1]){best=k;break}
          const nx=x+D[dd][0],ny=y+D[dd][1];const nb=[[x,y,(dd+1)%4],[x,y,(dd+3)%4]];if(!(nx<0||ny<0||nx>=N||ny>=N||walls.has(nx+","+ny)))nb.push([nx,ny,dd]);
          for(const z of nb){const kk=z.join(",");if(!(kk in c)){c[kk]=k+1;st.push(z)}}}
        return {walls,s,goal,dist:seen[goal+""],minBlocks:best}}
    }
    return {walls:new Set(),s:[0,N-1],goal:[N-1,0],dist:2*N-2,minBlocks:2*N};
  }
  const puzzle=async el=>{
    const m=maze();const limit=L>=3?m.minBlocks:99;   // siempre se puede: es el camino más corto sin «Repetir»
    const prog=[];let open=null;
    el.innerHTML=`<h3 class="qtext">Llevá al robot hasta la estrella ⭐ ${limit<99?`usando como máximo <b>${limit}</b> bloques`:""}</h3><p class="note">Empieza mirando hacia arriba. ${L>=2?"«Repetir» hace que los bloques de adentro se repitan.":""}</p>
      <div class="robo"><div class="grid" id="grid" style="--n:${N}"></div><div class="prog"><div class="blocks"><button type="button" data-b="F">⬆️ Avanzar</button><button type="button" data-b="L">↪️ Girar izq.</button><button type="button" data-b="R">↩️ Girar der.</button>${L>=2?`<button type="button" data-b="rep2">🔁 Repetir 2</button><button type="button" data-b="rep3">🔁 Repetir 3</button><button type="button" data-b="end">⏹ Cerrar repetir</button>`:""}<button type="button" data-b="del">⌫ Borrar</button></div><ol class="code" id="code"></ol><p id="cnt" class="note"></p></div></div>`;
    const cell=(x,y)=>m.walls.has(x+","+y)?"🧱":(x===m.goal[0]&&y===m.goal[1]?"⭐":"");
    const drawGrid=(rx,ry,dir)=>{$("grid").innerHTML=Array.from({length:N*N},(_,i)=>{const x=i%N,y=Math.floor(i/N);return `<span>${x===rx&&y===ry?`<b class="bot" style="transform:rotate(${dir*90}deg)">🤖</b>`:cell(x,y)}</span>`}).join("")};
    drawGrid(m.s[0],m.s[1],0);
    const count=p=>p.reduce((a,b)=>a+(b.t==="rep"?1+count(b.body):1),0);
    const label={F:"⬆️ Avanzar",L:"↪️ Girar izq.",R:"↩️ Girar der."};
    const render=(p=prog)=>p.map(b=>b.t==="rep"?`<li class="rep">🔁 Repetir ${b.n}<ol>${render(b.body)}</ol></li>`:`<li>${label[b.t]}</li>`).join("");
    const upd=()=>{$("code").innerHTML=render()||"<li class='hint'>Tocá bloques para armar el programa</li>";$("cnt").textContent=`${count(prog)} bloque${count(prog)===1?"":"s"}${limit<99?` de ${limit}`:""}${open?" · estás dentro de un Repetir":""}`};upd();
    el.querySelectorAll(".blocks button").forEach(b=>b.onclick=()=>{const k=b.dataset.b;const target=open?open.body:prog;
      if(k==="del"){if(open&&open.body.length)open.body.pop();else if(open){prog.pop();open=null}else{const l=prog.pop();if(l&&l.t==="rep")open=null}}
      else if(k==="end")open=null;
      else if(k.startsWith("rep")){if(open){FX.toast("Cerrá el repetir antes de abrir otro");return}const r={t:"rep",n:+k.slice(3),body:[]};prog.push(r);open=r}
      else target.push({t:k});FX.pop();upd()});
    await checkBtn(el,"▶️ Ejecutar",()=>prog.length?true:(FX.toast("Armá el programa primero"),null));
    const flat=[];const unroll=p=>p.forEach(b=>b.t==="rep"?Array.from({length:b.n},()=>unroll(b.body)):flat.push(b.t));unroll(prog);
    let x=m.s[0],y=m.s[1],dir=0,crash=false;const D=[[0,-1],[1,0],[0,1],[-1,0]];
    for(const c of flat){await new Promise(r=>setTimeout(r,320));if(c==="L")dir=(dir+3)%4;else if(c==="R")dir=(dir+1)%4;else{const nx=x+D[dir][0],ny=y+D[dir][1];if(nx<0||ny<0||nx>=N||ny>=N||m.walls.has(nx+","+ny)){crash=true;FX.bad();break}x=nx;y=ny;FX.pop()}drawGrid(x,y,dir);if(x===m.goal[0]&&y===m.goal[1])break}
    const won=!crash&&x===m.goal[0]&&y===m.goal[1];const within=count(prog)<=limit;
    return feedback(el,won&&within,crash?"El robot chocó: revisá hacia dónde mira antes de avanzar.":!won?"No llegó a la estrella. ¡Probá de nuevo en la próxima!":!within?`Llegó, pero usaste ${count(prog)} bloques y el máximo era ${limit}. Probá con Repetir.`:"¡Programa perfecto!");
  };
  rounds(box,"robot",[puzzle,puzzle,qRound("ia"),puzzle,puzzle,qRound("ia")]);
};

/* =====================================================================
   ROBOT PROGRAMADOR — motor (sin pantalla): mapas, programas y ejecución
   Un programa es una lista de bloques:
     {t:"F"} avanzar · {t:"L"} girar izq. · {t:"R"} girar der. · {t:"J"} saltar
     {t:"rep",n,body} repetir n veces · {t:"until",body} repetir hasta llegar
     {t:"if",c,body,els} si / si no · {t:"M"} usar «Mi bloque»
   Texto corto (para niveles y pruebas): F L R J M · 3[ ... ] · U[ ... ] · ?pared[ ... ][ ... ]
   Mapa: . piso · # pared · X caja · o pozo · k llave · D puerta · g gema · * estrella · ^ > v < robot
   ===================================================================== */
const RB={DIR:[[0,-1],[1,0],[0,1],[-1,0]],ARROW:["▲","▶","▼","◀"],MAXSTEPS:400};
RB.COND={
  pared:{txt:"hay pared adelante",i:"🧱"},
  pozo:{txt:"hay un pozo adelante",i:"🕳️"},
  der:{txt:"hay camino a la derecha",i:"➡️"},
  izq:{txt:"hay camino a la izquierda",i:"⬅️"}
};
RB.parse=function(src){
  const tk=src.replace(/\[/g," [ ").replace(/\]/g," ] ").trim().split(/\s+/).filter(Boolean);let i=0;
  const list=()=>{const out=[];while(i<tk.length&&tk[i]!=="]"){out.push(one())}return out};
  const grp=()=>{if(tk[i]!=="[")throw new Error("falta [ en "+src);i++;const b=list();i++;return b};
  const one=()=>{const t=tk[i++];
    if(/^\d+$/.test(t))return {t:"rep",n:+t,body:grp()};
    if(t==="U")return {t:"until",body:grp()};
    if(t[0]==="?"){const c=t.slice(1);const body=grp();const els=tk[i]==="["?grp():[];return {t:"if",c,body,els}}
    if("FLRJM".includes(t))return {t};
    throw new Error("bloque desconocido "+t)};
  return list();
};
RB.text=p=>p.map(b=>b.t==="rep"?`${b.n}[ ${RB.text(b.body)} ]`:b.t==="until"?`U[ ${RB.text(b.body)} ]`:b.t==="if"?`?${b.c}[ ${RB.text(b.body)} ][ ${RB.text(b.els)} ]`:b.t).join(" ");
RB.count=p=>p.reduce((a,b)=>a+1+(b.body?RB.count(b.body):0)+(b.els?RB.count(b.els):0),0);
/* estado inicial de un mapa */
RB.load=function(rows){
  const g=rows.map(r=>r.split(""));let x=0,y=0,d=0;
  g.forEach((r,j)=>r.forEach((c,i)=>{const k="^>v<".indexOf(c);if(k>=0){x=i;y=j;d=k;r[i]="."}}));
  return {g,w:g[0].length,h:g.length,x,y,d,key:0,gems:0,steps:0,won:false,path:[[x,y]]};
};
RB.cell=(s,x,y)=>(x<0||y<0||x>=s.w||y>=s.h)?"#":s.g[y][x];
RB.solid=c=>c==="#"||c==="X";
RB.ahead=(s,k=1,dd=s.d)=>{const [dx,dy]=RB.DIR[dd];return [s.x+dx*k,s.y+dy*k]};
RB.test=function(s,c){
  if(c==="pared"){const [x,y]=RB.ahead(s);const v=RB.cell(s,x,y);return RB.solid(v)||(v==="D"&&!s.key)}
  if(c==="pozo"){const [x,y]=RB.ahead(s);return RB.cell(s,x,y)==="o"}
  const dd=c==="der"?(s.d+1)%4:(s.d+3)%4;const [x,y]=RB.ahead(s,1,dd);const v=RB.cell(s,x,y);return !RB.solid(v)&&v!=="o"&&!(v==="D"&&!s.key);
};
/* pisar una casilla: junta llave/gema, abre puerta, llega a la estrella */
RB.enter=function(s,x,y){
  const v=RB.cell(s,x,y);
  if(RB.solid(v))return {err:"crash",msg:v==="X"?"Chocó contra una caja.":"Chocó contra la pared."};
  if(v==="o")return {err:"fall",msg:"¡Se cayó al pozo! Para pasar un pozo hay que saltar."};
  if(v==="D"){if(!s.key)return {err:"door",msg:"La puerta está cerrada: primero hay que buscar la llave 🔑."};s.key--;s.g[y][x]=".";s.opened=[x,y]}
  s.x=x;s.y=y;s.path.push([x,y]);
  if(v==="k"){s.key++;s.g[y][x]=".";s.got="k"}
  if(v==="g"){s.gems++;s.g[y][x]=".";s.got="g"}
  if(v==="*")s.won=true;
  return {};
};
RB.act=function(s,t){
  s.steps++;s.got=null;s.opened=null;
  if(t==="L"){s.d=(s.d+3)%4;return {}}
  if(t==="R"){s.d=(s.d+1)%4;return {}}
  if(t==="F"){const [x,y]=RB.ahead(s);return RB.enter(s,x,y)}
  if(t==="J"){const [mx,my]=RB.ahead(s);const m=RB.cell(s,mx,my);
    if(RB.solid(m)||m==="D")return {err:"crash",msg:"No se puede saltar eso: es muy alto. Solo se saltan pozos y casillas vacías."};
    const [x,y]=RB.ahead(s,2);return RB.enter(s,x,y)}
  return {};
};
/* ejecución paso a paso: cada paso dice qué bloque se está usando */
RB.run=function*(prog,fn,s){
  const lim=()=>s.steps>RB.MAXSTEPS;
  function* go(list,depth){
    for(const b of list){
      if(s.won)return;if(lim())return;
      if(b.t==="rep"){for(let k=0;k<b.n;k++){yield {b,info:`vuelta ${k+1} de ${b.n}`};s.steps++;yield* go(b.body,depth);if(s.won||s.err||lim())return}}
      else if(b.t==="until"){let k=0;while(!s.won){if(lim()){s.err={err:"loop",msg:"El robot dio vueltas y vueltas sin llegar: ¡un bucle infinito! Revisá las condiciones."};yield {b,err:s.err};return}
          k++;yield {b,info:`vuelta ${k}: ¿llegó? no → sigue`};s.steps++;const before=s.steps;yield* go(b.body,depth);if(s.err)return;if(s.steps===before)s.steps+=40}}
      else if(b.t==="if"){const r=RB.test(s,b.c);s.steps++;yield {b,info:`¿${RB.COND[b.c].txt}? → ${r?"sí":"no"}`,cond:r};yield* go(r?b.body:b.els,depth);if(s.err)return}
      else if(b.t==="M"){if(depth>6){s.err={err:"loop",msg:"«Mi bloque» se usa a sí mismo sin parar."};yield {b,err:s.err};return}yield {b,info:"usa «Mi bloque»"};yield* go(fn||[],depth+1);if(s.err)return}
      else{const r=RB.act(s,b.t);if(r.err){s.err=r;yield {b,err:r};return}yield {b,moved:true}}
    }
  }
  yield* go(prog,0);
  if(!s.won&&!s.err&&lim()){s.err={err:"loop",msg:"El programa es demasiado largo: el robot se cansó. ¿Hay un bucle que no termina?"};yield {err:s.err}}
};
/* prueba rápida (sin animación) */
RB.check=function(prog,fn,rows){const s=RB.load(rows);for(const st of RB.run(prog,fn,s)){if(s.won)break}return s};
/* fabrica un mapa a partir de un recorrido (lo usan algunos niveles):
   F J L R mueven; x pone una caja adelante; o pone un pozo adelante (sin moverse); k/g/D marcan la casilla actual */
RB.gen=function(path,o={}){
  const m={},put=(x,y,c)=>{m[x+","+y]=c};let x=0,y=0,d=o.d||0;put(0,0,"S");
  for(const t of path.split(/\s+/).filter(Boolean)){const [dx,dy]=RB.DIR[d];
    if(t==="L")d=(d+3)%4;else if(t==="R")d=(d+1)%4;
    else if(t==="F"){x+=dx;y+=dy;if(!m[x+","+y]||m[x+","+y]==="#")put(x,y,".")}
    else if(t==="J"){put(x+dx,y+dy,"o");x+=2*dx;y+=2*dy;put(x,y,".")}
    else if(t==="x")put(x+dx,y+dy,"X");else if(t==="o")put(x+dx,y+dy,"o");
    else if("kgD".includes(t))put(x,y,t)}
  put(x,y,"*");
  const ks=Object.keys(m).map(k=>k.split(",").map(Number));const xs=ks.map(k=>k[0]),ys=ks.map(k=>k[1]);
  const x0=Math.min(...xs)-(o.pad||0),x1=Math.max(...xs)+(o.pad||0),y0=Math.min(...ys)-(o.pad||0),y1=Math.max(...ys)+(o.pad||0);
  const rows=[];for(let j=y0;j<=y1;j++){let r="";for(let i=x0;i<=x1;i++){const c=m[i+","+j];r+=c==="S"?"^>v<"[o.d||0]:c||(o.fill||"#")}rows.push(r)}
  return rows;
};
if(typeof module!=="undefined")module.exports=RB;

/* ---------- dibujo del tablero ---------- */
const RB_CELL={"#":"","X":"📦","o":"🕳️","k":"🔑","D":"🚪","g":"💎","*":"⭐",".":""};
function rbBoard(s,id,fx={}){
  const trail=new Set((s.path||[]).map(p=>p+""));
  let h="";for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const c=s.g[y][x];const here=x===s.x&&y===s.y;
    h+=`<span class="${c==="#"?"w":""} ${trail.has(x+","+y)?"tr":""} ${here&&fx.bad?"bad":""}">${here?`<b class="rbot ${fx.jump?"jump":""}"><i>🤖</i><em class="d${s.d}">${RB.ARROW[s.d]}</em>${s.key?`<small>🔑</small>`:""}</b>`:RB_CELL[c]||""}</span>`}
  return `<div class="rgrid" ${id?`id="${id}"`:""} style="--w:${s.w};--h:${s.h}">${h}</div>`;
}
/* programa en solo lectura (para la ayuda) */
function rbStatic(p){return `<ol class="rb-prog ro">${p.map(b=>{const B=RBLK[b.t];
  if(b.t==="rep")return `<li class="rb-c k-lp"><div class="rb-h">🔁 Repetir <span class="rb-n">${b.n}</span> veces</div>${rbStatic(b.body)}</li>`;
  if(b.t==="until")return `<li class="rb-c k-lp"><div class="rb-h">🔄 Repetir hasta llegar a ⭐</div>${rbStatic(b.body)}</li>`;
  if(b.t==="if")return `<li class="rb-c k-cd"><div class="rb-h">📡 Si <span class="rb-cnd">${RB.COND[b.c].i} ${RB.COND[b.c].txt}</span></div>${rbStatic(b.body)}<div class="rb-h2">Si no:</div>${rbStatic(b.els)}</li>`;
  return `<li class="rb-b k-${B.k}">${B.i} ${B.n}</li>`}).join("")}</ol>`}

/* ---------- ayuda de un bloque (el botón «?») ---------- */
function rbHelp(t){
  const B=RBLK[t];const ex=B.ex;const prog=RB.parse(ex.p),fn=ex.fn?RB.parse(ex.fn):null;
  const b=UI.modal(`<div class="rb-help"><h3>${B.i} ${B.n}</h3>

    ${B.how?`<p><b>¿Cómo se arma?</b></p><ol class="rb-how">${B.how.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}
    ${B.cmp?`<div class="rb-cmp"><div><small>Sin repetir: ${RB.count(RB.parse(B.cmp[0]))} bloques</small>${rbStatic(RB.parse(B.cmp[0]))}</div><div><small>Con repetir: ${RB.count(RB.parse(B.cmp[1]))} bloques</small>${rbStatic(RB.parse(B.cmp[1]))}</div></div>`:""}
    <p><b>Ejemplo:</b></p><div class="rb-demo"><div id="hBoard"></div><div>${rbStatic(prog)}${fn?`<p class="note">🧩 Mi bloque =</p>${rbStatic(fn)}`:""}</div></div>
    <div class="mactions"><button class="btn" type="button" id="hPlay">▶️ Ver el ejemplo</button><button class="btn primary" type="button" id="hOk">¡Entendido!</button></div></div>`,true);
  let s=RB.load(ex.g),alive=true;const draw=(fx)=>{$("hBoard").innerHTML=rbBoard(s,null,fx)};draw();

    if(alive){if(s.won){FX.good();FX.confetti(20)}$("hPlay").disabled=false;$("hPlay").textContent="🔁 Ver otra vez"}};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- progreso guardado ---------- */
const rbP=()=>{const p=G.P;if(!p.robo)p.robo={s:{},g:{},q:{},seen:{},done:{}};return p.robo};
const rbKey=(w,i)=>w+"-"+(i+1);
const rbOpen=(w,i)=>{const r=rbP();if(w>1&&!(r.s[rbKey(w-1,4)]>0))return false;return i===0||r.s[rbKey(w,i-1)]>0};
const rbWorldStars=w=>RLEVELS[w].reduce((a,_,i)=>a+(rbP().s[rbKey(w,i)]||0),0);

GAMEFN.robot=function(box,L){

      <div class="rb-edit"><button class="btn small" type="button" id="rbDel">⌫ Borrar</button><button class="btn small" type="button" id="rbOut">⏎ Salir del bloque</button><button class="btn small" type="button" id="rbClr">🗑️ ${LV.given?"Volver al original":"Borrar todo"}</button></div>
      <p class="note rb-tipline">Tocá un bloque del programa para elegir dónde agregar (la línea violeta ▸). ⌫ borra el bloque tocado.</p>

  $("rbBack").onclick=()=>{alive=false;nav.map()};

  box.querySelectorAll(".rb-tabs button").forEach(b=>b.onclick=()=>{if(busy)return;mapK=+b.dataset.k;resetRun()});
  showMap(0);

  /* ----- editor ----- */

  const reg=l=>{let k=REG.indexOf(l);if(k<0){REG.push(l);k=REG.length-1}return k};
  const caretLi=`<li class="rb-caret">▸ los bloques nuevos van acá</li>`;
  const html=(list,top)=>{let h="";list.forEach((b,i)=>{if(caret.l===list&&caret.i===i)h+=caretLi;h+=one(b,list,i)});
    if(caret.l===list&&caret.i===list.length)h+=caretLi;else h+=`<li class="rb-slot" data-into="${reg(list)}">＋${top?"":" adentro"}</li>`;return h};
  const one=(b,list,i)=>{b._id=b._id||++nid;const B=RBLK[b.t],at=`data-l="${reg(list)}" data-i="${i}" data-id="${b._id}"`;
    if(b.t==="rep")return `<li class="rb-c k-lp" data-id="${b._id}"><div class="rb-h" ${at}>🔁 Repetir <button type="button" class="rb-n" data-n="${b._id}">${b.n}</button> veces</div><ol>${html(b.body)}</ol></li>`;
    if(b.t==="until")return `<li class="rb-c k-lp" data-id="${b._id}"><div class="rb-h" ${at}>🔄 Repetir hasta llegar a ⭐</div><ol>${html(b.body)}</ol></li>`;
    if(b.t==="if")return `<li class="rb-c k-cd" data-id="${b._id}"><div class="rb-h" ${at}>📡 Si <button type="button" class="rb-cnd" data-c="${b._id}">${RB.COND[b.c].i} ${RB.COND[b.c].txt}</button></div><ol>${html(b.body)}</ol><div class="rb-h2">Si no:</div><ol>${html(b.els)}</ol></li>`;
    return `<li class="rb-b k-${B.k}" ${at}>${B.i} ${B.n}</li>`};
  const all=()=>{const out=[];const walk=l=>l.forEach(b=>{out.push(b);if(b.body)walk(b.body);if(b.els)walk(b.els)});walk(main);walk(fn);return out};
  const parentOf=l=>{let res=null;const walk=(list)=>list.forEach((b,i)=>{if(b.body===l||b.els===l)res={l:list,i};if(b.body)walk(b.body);if(b.els)walk(b.els)});walk(main);walk(fn);return res};
  const inFn=l=>{if(l===fn)return true;const p=parentOf(l);return p?inFn(p.l):false};
  const render=()=>{REG=[];$("rbProg").innerHTML=html(main,true);if(hasFn)$("rbFn").innerHTML=html(fn,true);
    const n=RB.count(main)+RB.count(fn);$("rbCnt").innerHTML=`${n} bloque${n===1?"":"s"} · meta ⭐⭐⭐: ${par}`;$("rbCnt").className=n<=par?"ok":"over";
    box.querySelectorAll("[data-l]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(busy)return;caret={l:REG[+e.dataset.l],i:+e.dataset.i+1};FX.pop();render()});

    box.querySelectorAll(".rb-n").forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(busy)return;const b=all().find(x=>x._id==e.dataset.n);b.n=b.n>=12?2:b.n+1;edited();render()});
    box.querySelectorAll(".rb-cnd").forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(busy)return;const b=all().find(x=>x._id==e.dataset.c);b.c=conds[(conds.indexOf(b.c)+1)%conds.length];edited();render()});
    const c=box.querySelector(".rb-caret");if(c&&!busy)c.scrollIntoView({block:"nearest"})};
  $("rbProg").onclick=()=>{if(busy)return;caret={l:main,i:main.length};render()};

    const nb=t==="rep"?{t,n:2,body:[]}:t==="until"?{t,body:[]}:t==="if"?{t,c:conds[0],body:[],els:[]}:{t};
    caret.l.splice(caret.i,0,nb);

  $("rbOut").onclick=()=>{if(busy)return;const p=parentOf(caret.l);if(p){caret={l:p.l,i:p.i+1};render()}else FX.toast("Ya estás afuera de los bloques.")};
  $("rbClr").onclick=()=>{if(busy)return;main.length=0;if(LV.given)RB.parse(LV.given).forEach(b=>main.push(b));fn.length=0;caret={l:main,i:main.length};edited();render()};
  render();

  /* ----- ejecución ----- */
  const clearHi=()=>box.querySelectorAll(".hi,.hib").forEach(e=>e.classList.remove("hi","hib"));
  const hi=(b,bad)=>{clearHi();if(!b)return;const e=box.querySelector(`[data-id="${b._id}"]`);if(!e)return;const t=e.classList.contains("rb-c")?e.querySelector(".rb-h"):e;t.classList.add(bad?"hib":"hi");if(bad||matchMedia("(min-width:701px)").matches)t.scrollIntoView({block:"nearest"})};
  const prog=()=>main,fnl=()=>hasFn?fn:null;
  /* avanza un paso; devuelve {done, win, fail} */
  function next(){
    if(!run){mapK=run?mapK:0;st=RB.load(maps[0]);run={k:0,gen:RB.run(prog(),fnl(),st)};showMap(0);msg(maps.length>1?"Mapa 1: ¡arranca!":"¡Arranca!");return {}}
    const it=run.gen.next();
    if(it.done||st.won){
      if(st.won){if(run.k<maps.length-1){run.k++;st=RB.load(maps[run.k]);run.gen=RB.run(prog(),fnl(),st);showMap(run.k);msg(`✅ ¡Mapa ${run.k} listo! Ahora el mismo programa en el mapa ${run.k+1}…`,"ok");return {}}
        return {done:true,win:true}}
      const n=RB.count(main);return {done:true,fail:{msg:n?"Se terminaron los bloques y el robot no llegó a la ⭐. ¿Falta algún paso?":"El programa está vacío: agregá bloques."}}}
    const s=it.value;hi(s.b,!!s.err);
    showMap(run.k,{jump:s.b&&s.b.t==="J",bad:!!s.err});if(s.moved){if(st.got==="k"){FX.good();msg("🔑 ¡Juntó la llave!","ok")}else if(st.got==="g"){FX.good();msg("💎 ¡Una gema!","ok")}else if(st.opened){FX.pop();msg("🚪 Abrió la puerta con la llave.","ok")}else{FX.pop();msg(`${RBLK[s.b.t].i} ${RBLK[s.b.t].n}`)}}
    if(s.info)msg(`${s.b?RBLK[s.b.t].i:""} ${esc(s.info)}`);
    if(s.err)return {done:true,fail:s.err,b:s.b};
    if(st.won&&run.k<maps.length-1)return next();
    if(st.won)return {done:true,win:true};
    return {}}
  const lock=v=>{busy=v;box.querySelector(".rb-lvl").classList.toggle("running",v);["rbGo","rbStep","rbReset"].forEach(id=>$(id).disabled=v&&id!=="rbGo");$("rbGo").textContent=v?"⏸️ Pausa":"▶️ Probar"};
  let auto=false;
  async function play(){
    if(auto){auto=false;return}
    if(!RB.count(main)){FX.toast("Primero armá el programa con los bloques.");return}
    if(run&&run.over)resetRun();
    auto=true;lock(true);$("rbB").scrollIntoView({block:"nearest",behavior:"smooth"});
    while(auto&&alive){const r=next();if(r.done){auto=false;lock(false);end(r);return}await sleep(speed)}
    lock(false);if(alive)msg("⏸️ En pausa. Seguí con 👣 o ▶️.")}
  function stepOnce(){if(busy)return;if(!RB.count(main)){FX.toast("Primero armá el programa con los bloques.");return}
    if(run&&run.over)resetRun();const r=next();if(r.done)end(r)}
  $("rbGo").onclick=play;$("rbStep").onclick=stepOnce;$("rbReset").onclick=()=>{if(busy)return;resetRun();msg("El robot volvió al inicio.")};
  function end(r){if(!alive)return;run.over=true;
    if(r.fail){fails++;FX.bad();FX.shake($("rbB"));
      msg(`❌ ${esc(r.fail.msg)}${r.b?" <br><small>El bloque en rojo es donde pasó. Corregí el programa y probá otra vez (probar es gratis).</small>":""}`,"bad");
      const hp=$("rbHelps");let h="";
      if(fails>=2)h+=`<button class="btn small" type="button" id="rbTip">💡 Pista</button>`;
      if(fails>=4&&!usedSol)h+=`<button class="btn small" type="button" id="rbSol">👀 Ver una solución (−${fmtM(HELP_COST)})</button>`;
      hp.innerHTML=h;
      if($("rbTip"))$("rbTip").onclick=()=>msg("💡 "+esc(LV.tip),"tip");
      if($("rbSol"))$("rbSol").onclick=()=>{if(!G.spend(HELP_COST)){FX.toast("No te alcanza la plata para esta ayuda.");return}G.save();usedSol=true;
        main.length=0;RB.parse(LV.sol).forEach(b=>main.push(b));fn.length=0;if(LV.fn)RB.parse(LV.fn).forEach(b=>fn.push(b));caret={l:main,i:main.length};resetRun();render();$("rbHelps").innerHTML="";
        msg("👀 Esta es una solución posible. Miralo con 👣 Paso a paso para entenderla. (Con ayuda, el nivel da 1 estrella.)","tip")};
      return}
    win()}
  function win(){
    const n=RB.count(main)+RB.count(fn);const stars=usedSol?1:1+(fails<2?1:0)+(n<=par?1:0);
    const old=r.s[key]||0;let pay=0;const lines=[];
    if(stars>old){pay+=G.earn(rbStarPay(w)*(stars-old));r.s[key]=stars}
    const gems=st.gems;if(gems&&!r.g[key]){r.g[key]=1;pay+=G.earn(RB_GEM*gems);lines.push(`💎 Gema: ${plus(RB_GEM*gems)}`)}
    if(stars>old)G.addXP(4*(stars-old),0);
    let medal="";
    if(li===4&&!r.done[w]){r.done[w]=1;const res=G.gameDone("robot",rbWorldStars(w),15,{allowDown:false});if(res.medal)medal=`<p class="rb-medal">${R.medal(res.medal,48)} ¡Mundo completo! ${esc(R.medalName(res.medal))} ${plus(res.cents)}</p>`;else medal=`<p class="rb-medal">✅ ¡Mundo ${w} completo!</p>`;pay+=res.cents}
    G.save();FX.good();FX.confetti(stars*30);
    const why=[];if(!usedSol){if(fails>=2)why.push("⭐⭐ se gana llegando en 1 o 2 intentos");if(n>par)why.push(`⭐⭐⭐ se gana con ${par} bloques o menos (usaste ${n})`)}
    UI.modal(`<div class="rb-win"><div class="rb-bigstars">${rbStars(stars)}</div><h3>${stars===3?"¡Perfecto!":"¡Llegó a la estrella!"}</h3>
      <p>${stars>old?`Estrellas nuevas: ${plus(rbStarPay(w)*(stars-old))}`:old?`Ya tenías ${old} ⭐ en este nivel.`:""}</p>${lines.map(l=>`<p>${l}</p>`).join("")}${medal}
      ${why.length?`<p class="note">Para mejorar: ${why.join(" · ")}</p>`:""}
      <div class="mactions"><button class="btn" type="button" id="wMap">🗺️ Mapa</button>${stars<3?`<button class="btn" type="button" id="wAgain">🔁 Mejorar</button>`:""}<button class="btn primary" type="button" id="wNext">Siguiente ▶</button></div></div>`);
    $("wMap").onclick=()=>{UI.close();alive=false;nav.map()};
    if($("wAgain"))$("wAgain").onclick=()=>{UI.close();fails=0;resetRun();msg("¡A mejorarlo! Intentá con menos bloques o sin chocar.")};
    $("wNext").onclick=()=>{UI.close();alive=false;nav.next()};
  }
  return ()=>{alive=false;auto=false};
}

GAMEFN.ingles=function(box,L){

    $("play").onclick=()=>say(d.line);setTimeout(()=>say(d.line),300);
    const r=await new Promise(res=>el.querySelectorAll(".qopt").forEach(x=>x.onclick=()=>res(x.textContent)));
    if(r===d.ok)say(d.ok);
    return feedback(el,r===d.ok,`«${d.ok}» ${d.es.replace("perdida",ao("perdida","perdido"))}`);
  };
  const map=async el=>{
    // mapa de 4×4 manzanas: arrancás abajo en el medio, mirando al norte
    const P=["🏛️ museum","🌳 park","💊 pharmacy","🛒 supermarket","🚉 train station","🏥 hospital","📚 library","🍦 ice cream shop"];
    const N=4;let x=2,y=N,dir=0;const D=[[0,-1],[1,0],[0,1],[-1,0]];const steps=[];const parts=[];
    const go=n=>{for(let i=0;i<n;i++){x+=D[dir][0];y+=D[dir][1]}};
    const n1=rnd(1,2);go(n1);parts.push(`Go straight ahead ${n1===1?"one block":"two blocks"}.`);
    const t=pick(["left","right"]);dir=t==="left"?3:1;const n2=rnd(1,L>=3?2:1);if(x+(dir===1?n2:-n2)<0||x+(dir===1?n2:-n2)>N)dir=dir===1?3:1;go(n2);parts.push(`Turn ${dir===3?"left":"right"} and walk ${n2===1?"one block":"two blocks"}.`);
    if(L>=3&&y>=1){const t2=dir===1?"left":"right";dir=0;go(1);parts.push(`Then turn ${t2} and go one more block.`)}
    const spots={};const corners=[];for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)corners.push([i,j]);
    const target=[x,y];const others=shuffle(corners.filter(c=>!(c[0]===x&&c[1]===y)&&!(c[0]===2&&c[1]===N))).slice(0,3);const places=shuffle(P).slice(0,4);

/* ================= 9. LÍNEA DE TIEMPO ================= */

    el.innerHTML=`<h3 class="qtext">Ubicá los hechos en la línea del tiempo: arriba lo que pasó <b>antes</b>, abajo lo que pasó <b>después</b>.</h3>

  };

    el.innerHTML=`<h3 class="qtext">⚖️ Mové el punto de apoyo hasta que la palanca quede equilibrada.</h3><p class="note">Equilibrio: peso × distancia de un lado = peso × distancia del otro.</p><div id="lc"></div><input id="fulc" type="range" min="1" max="9" step="${L>=3?0.5:1}" value="5" aria-label="Punto de apoyo"><p class="center" id="lv"></p>`;

    const draw=now=>{const dt=Math.max(0,Math.min(.05,(now-tP)/1000));tP=now;const W=cv.W,H=cv.H;const f=+$("fulc").value;const tq=torque();ang+=(clamp(tq/60,-0.35,0.35)-ang)*Math.min(1,dt*4);
      ctx.fillStyle="#f5f3ff";ctx.fillRect(0,0,W,H);const x0=W*0.08,x1=W*0.92,u=(x1-x0)/len,fx=x0+f*u,fy=H*0.62;

      ctx.fillStyle="#1f2937";ctx.font="bold 13px system-ui";ctx.textAlign="center";
      ctx.fillStyle="#3b82f6";ctx.fillRect(-f*u,-6-34,34,34);ctx.fillStyle="#fff";ctx.fillText(w1+" kg",-f*u+17,-18);
      ctx.fillStyle="#ef4444";ctx.fillRect((len-f)*u-34,-6-34,34,34);ctx.fillStyle="#fff";ctx.fillText(w2+" kg",(len-f)*u-17,-18);ctx.restore();

/* ---------- engranajes ---------- */

/* ---------- tipos de palanca ---------- */

      <div class="mactions">${v.host||NET.mode==="local"?`<button class="btn primary" id="mAgain" type="button">🔁 Otra partida en esta sala</button>`:`<p class="note">Esperando si arman otra partida…</p>`}<button class="btn" id="mLeave" type="button">Salir</button></div>${emoteBar()}</div>`;

   CONEXIÓN CON LA HOJA Y FLUJO DE LA APP

const API_URL="https://script.google.com/macros/s/AKfycbwoeqElI4TQsT5V6QpCNOkwVgS8BUxEzQLKNHjX5AgtmVgeZD8KRkLW_upLYQkYMkr--A/exec";   // ← URL de la aplicación web de Apps Script (termina en /exec)
const API_OK=()=>API_URL.startsWith("https://");
const SS={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const MJ={name:"",user:"",taller:"ABIERTO",friends:[],cred:null,demo:false};

async function api(action,extra){
  if(MJ.demo)return {ok:true,name:MJ.name,user:MJ.user,taller:MJ.taller,friends:[]};
  if(!API_OK())throw new Error("Falta pegar la URL de la hoja en index.html (API_URL).");
  let r;try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action,user:MJ.cred.user,code:MJ.cred.code},extra||{}))})}catch(e){throw new Error("Sin conexión con la hoja. Revisá internet.")}
  let j;try{j=await r.json()}catch(e){throw new Error("La hoja respondió algo raro. Revisá que la implementación sea para «Cualquier usuario».")}
  if(!j.ok){const e=new Error(j.error||"Error");e.auth=j.auth===false;throw e}
  if(j.friends)MJ.friends=j.friends;if(j.taller)MJ.taller=j.taller;
  return j;
}
G.onSync=function(p,beacon){
  if(MJ.demo||!MJ.cred||!API_OK())return;
  const body=JSON.stringify({action:"saveProgress",user:MJ.cred.user,code:MJ.cred.code,progress:p});
  if(beacon&&navigator.sendBeacon){try{navigator.sendBeacon(API_URL,new Blob([body],{type:"text/plain;charset=utf-8"}));return}catch(e){}}
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body}).then(r=>r.json()).then(j=>{if(j.friends)MJ.friends=j.friends}).catch(()=>{});
};
MJ.lockRewards=async function(){if(MJ.demo){MJ.taller="BLOQUEADO";return}await api("lockRewards",{progress:G.P})};

async function login(cred,demo){
  MJ.cred=cred;MJ.demo=!!demo;$("lErr").textContent="";$("lBtn").disabled=true;$("lBtn").textContent="Entrando…";
  try{
    if(demo){MJ.name=cred.user;MJ.user="demo-"+cred.user.toLowerCase();MJ.taller=(localStorage.getItem("mj-demo-taller-"+MJ.user)||"ABIERTO")}
    const j=await api("login");
    if(!demo){MJ.name=j.name;MJ.user=j.user;if(j.questions&&j.questions.length)G.setQuestions(j.questions)}
    SS.set("mj-cred",{cred,demo:!!demo});
    G.load(MJ.user);G.merge(j.progress);G.checkComeback();G.checkAwards();MJ.remember();
    $("login").hidden=true;$("app").hidden=false;$("whoName").textContent=MJ.name;
    MJ.next();
  }catch(e){if(e.auth)SS.del("mj-cred");$("lErr").textContent=e.message;$("login").hidden=false;$("app").hidden=true}
  finally{$("lBtn").disabled=false;$("lBtn").textContent="Entrar"}
}
/* primera vez: avatar → taller de premios → inicio */
MJ.next=function(){
  if(MJ.demo&&MJ.taller==="BLOQUEADO")try{localStorage.setItem("mj-demo-taller-"+MJ.user,"BLOQUEADO")}catch(e){}
  if(!G.P.avatar){setOnboarding(true);document.querySelectorAll(".view").forEach(el=>el.hidden=el.id!=="v-avatar");UI.avatar(true);return}
  if(MJ.taller==="ABIERTO"){setOnboarding(true);document.querySelectorAll(".view").forEach(el=>el.hidden=el.id!=="v-taller");UI.taller();return}
  setOnboarding(false);UI.hud();UI.show("inicio");
};
function setOnboarding(on){document.body.classList.toggle("onboarding",on);$("tabs").hidden=on}
function logout(){if(G.P){MJ.remember();G.flush()}SS.del("mj-cred");MJ.cred=null;UI.cur=null;$("app").hidden=true;$("login").hidden=false;$("lPass").value="";loginFace();$("lUser").focus()}

/* pantalla de ingreso personalizada: muestra el avatar de quien escribe su usuario (guardado en este dispositivo) */
MJ.faces=()=>{try{return JSON.parse(localStorage.getItem("aa-faces"))||{}}catch(e){return {}}};
MJ.remember=function(){if(!MJ.cred||!G.P||!G.P.avatar)return;try{const f=MJ.faces();f[MJ.cred.user.toLowerCase()]={avatar:G.P.avatar,name:MJ.name};localStorage.setItem("aa-faces",JSON.stringify(f))}catch(e){}};
function loginFace(){
  const u=$("lUser").value.trim().toLowerCase();const f=MJ.faces()[u];
  $("loginAv").innerHTML=f&&f.avatar?`<div class="lav" style="--me:${f.avatar.topColor||"#7c3aed"}">${avatarSVG(f.avatar,74,"wave",{mood:"happy"})}</div><p><span>¡Hola, <b>${esc(f.name)}</b>!</span><small>Tu avatar te está esperando. Escribí tu código.</small></p>`
    :`<div class="lav ghost">${avatarSVG(defaultAvatar("nena"),74,"stand")}</div><p>¿Quién viene a jugar?<small>${u?"Cuando entres, acá vas a ver tu avatar.":"Escribí tu usuario y aparece tu avatar."}</small></p>`;
}
/* inclinación 3D de las tarjetas al mover el mouse */
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const el=e.target.closest&&e.target.closest(".gamecard,.subj,.hero,.camino");
  document.querySelectorAll(".tilt").forEach(x=>{if(x!==el){x.classList.remove("tilt");x.style.transform=""}});
  if(!el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=el.getBoundingClientRect();const dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;
  el.classList.add("tilt");el.style.transform=`translateY(-4px) rotateX(${(-dy*8).toFixed(2)}deg) rotateY(${(dx*10).toFixed(2)}deg)`});
/* todos los botones suenan al tocarlos */
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button,.btn,[role=button]");if(!b||b.disabled)return;FX.tone(b.classList.contains("primary")?880:640,.05,"triangle",.07)},{passive:true});
/* eventos */
$("crestL").innerHTML=crestSVG(92);$("crestB").innerHTML=crestSVG(28);
try{document.querySelector('link[rel="icon"]').href="data:image/svg+xml,"+encodeURIComponent(crestSVG(64).replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '))}catch(e){}
$("lUser").addEventListener("input",loginFace);loginFace();
$("loginForm").addEventListener("submit",e=>{e.preventDefault();login({user:$("lUser").value.trim().toLowerCase(),code:$("lPass").value.trim()},false)});
$("demoBtn").onclick=()=>{const n=$("lUser").value.trim()||"Invitada";login({user:n,code:""},true)};
$("eye").onclick=()=>{const p=$("lPass"),show=p.type==="password";p.type=show?"text":"password";$("eye").setAttribute("aria-pressed",show);$("eye").setAttribute("aria-label",show?"Ocultar código":"Mostrar código");$("eye").textContent=show?"🙈":"👁️";p.focus()};
$("logout").onclick=logout;
$("muteBtn").onclick=()=>{G.mute=!G.mute;if(G.mute&&typeof MUSIC!=="undefined")MUSIC.stop();$("muteBtn").textContent=G.mute?"🔇":"🔊";$("muteBtn").setAttribute("aria-pressed",G.mute)};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>UI.show(b.dataset.v));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&G.P&&MJ.cred)G.flush()});
(function(){
  if(!API_OK()){$("lNote").innerHTML="Todavía no está conectada la hoja de Google. Podés <b>probar sin hoja</b>: lo que hagas queda solo en este navegador.";$("demoBtn").hidden=false}
  const s=SS.get("mj-cred");if(s&&s.cred){$("lUser").value=s.cred.user;login(s.cred,s.demo)}
})();

</script>
</body>
</html>
