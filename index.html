<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Alpha by Kendra</title>
<meta name="description" content="Juegos para aprender matemáticas, economía, geografía, historia, cívica, inglés, inteligencia artificial y salud.">
<meta name="theme-color" content="#6d28d9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%236d28d9%22/%3E%3Ctext x=%2250%22 y=%2272%22 font-size=%2266%22 text-anchor=%22middle%22 fill=%22%23fde68a%22 font-family=%22Georgia%22 font-weight=%22700%22%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de una columna, cabecera con monedas y racha, pestañas abajo en el celu */
:root{
  --bg:#f6f3ff; --surface:#ffffff; --ink:#1e1b4b; --muted:#6b6894; --line:#e4defc;
  --brand:#6d28d9; --brand-soft:#ede9fe; --accent:#f59e0b; --ok:#059669; --ok-soft:#d1fae5; --bad:#dc2626; --bad-soft:#fee2e2;
  --shelf:#c69462; --shelf2:#8a5a2e;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13112b;--surface:#1e1b3a;--ink:#f1efff;--muted:#a9a4d6;--line:#34305e;--brand:#a78bfa;--brand-soft:#2e2758;--ok:#34d399;--ok-soft:#0f3b2f;--bad:#f87171;--bad-soft:#47181c;--shelf:#6b4a2f;--shelf2:#3d2817;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13112b;--surface:#1e1b3a;--ink:#f1efff;--muted:#a9a4d6;--line:#34305e;--brand:#a78bfa;--brand-soft:#2e2758;--ok:#34d399;--ok-soft:#0f3b2f;--bad:#f87171;--bad-soft:#47181c;--shelf:#6b4a2f;--shelf2:#3d2817;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
[hidden]{display:none!important}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
.note{color:var(--muted);font-size:14px;margin:0}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:9px 16px;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn.big{font-size:18px;padding:12px 22px}
.btn.small{min-height:34px;padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:18px}
.vhead h2{font-size:28px}
.vhead .note{margin-top:4px}
.sect{font-size:20px;margin-top:4px}

#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,440px);pointer-events:none}
.gtoast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:tin .3s}
.gtoast.out{opacity:0;transform:translateY(-8px);transition:.4s}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}*{animation-duration:.01ms!important}}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 20% 10%,#c4b5fd55,transparent 40%),radial-gradient(circle at 80% 80%,#fcd34d55,transparent 40%),var(--bg)}
.login form{background:var(--surface);border:3px solid var(--brand);border-radius:28px;padding:28px 22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 var(--line)}
.logo{font-size:56px;text-align:center;line-height:1}
.login h1{text-align:center;color:var(--brand);font-size:34px}
.sub{text-align:center;margin:-6px 0 4px;color:var(--muted);font-weight:700}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
.login input{padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.passwrap{position:relative;display:block}.passwrap input{padding-right:50px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;font-size:20px;cursor:pointer;border-radius:10px}
.err{color:var(--bad);font-weight:800;text-align:center;min-height:1.4em}

/* cabecera */
.appbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;max-width:980px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:700;color:var(--brand);font-size:22px}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.hchip.fire{border-color:#f97316}
.who{display:flex;align-items:center;gap:6px;font-size:14px}
.btn.icon{padding:4px 8px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:4px;justify-content:center;background:var(--bg);border-bottom:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px))}
.tabs button{font:inherit;font-weight:800;font-size:14px;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button span{font-size:20px}
.tabs button[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
@media (max-width:720px){
  .tabs{position:fixed;bottom:0;top:auto;left:0;right:0;border-bottom:0;border-top:2px solid var(--line);justify-content:space-around;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:0}
  .tabs button{flex-direction:column;gap:0;font-size:11px;padding:4px 8px}
  #app .wrap{padding-bottom:110px}
  body.onboarding #app .wrap{padding-bottom:40px}
  .brand{font-size:18px}
}

/* inicio */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:3px solid var(--brand);border-radius:26px;padding:16px}
.heroav{background:var(--surface);border-radius:22px;padding:6px;flex-shrink:0}
.heroinfo{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px}
.heroinfo h2{font-size:30px;color:var(--brand)}
.lvl{display:flex;justify-content:space-between;align-items:baseline}
.lvl b{font-family:var(--display);font-size:20px}
.bar{display:block;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px;transition:width .6s}
.streak{display:flex;gap:10px;align-items:center}
.streak small{display:block;color:var(--muted)}
.flame{font-size:34px;filter:grayscale(1);opacity:.4}.flame.on{filter:none;opacity:1}
.daily{font:inherit;display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(135deg,#fde68a,#fbbf24);color:#422006;border:0;border-radius:22px;padding:16px;cursor:pointer;box-shadow:0 6px 0 #b45309}
.daily.done{background:linear-gradient(135deg,#d1fae5,#6ee7b7);color:#064e3b;box-shadow:0 6px 0 #059669}
.daily.rev{background:linear-gradient(135deg,#e0e7ff,#a5b4fc);color:#1e1b4b;box-shadow:0 6px 0 #4f46e5}
.daily b{font-family:var(--display);font-size:22px;display:block}
.dico{font-size:40px}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.subj{font:inherit;position:relative;text-align:left;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.subj:hover{border-color:var(--c)}
.subj b{font-family:var(--display);font-size:18px;padding-right:34px}
.subj .bar i{background:var(--c)}
.subj small{color:var(--muted);font-size:12px}
.sico{font-size:32px}
.sbadge{position:absolute;top:8px;right:8px}

/* juegos */
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.gamecard{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-top:8px solid var(--c);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .15s}
.gamecard:hover{transform:translateY(-3px)}
.gico{font-size:42px}
.gamecard b{font-family:var(--display);font-size:20px}
.gdesc{color:var(--muted);font-size:14px;flex:1}
.gfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.mcount{display:flex;align-items:center;gap:2px;font-weight:800;font-size:13px}.mcount i{font-style:normal;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--c,var(--brand)) 15%,transparent);color:var(--c,var(--brand));font-weight:800;border-radius:99px;padding:3px 10px;font-size:13px}
.chip.lv{--c:#64748b}.chip.rev{--c:#d97706}
.playbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.playbar b{font-family:var(--display);font-size:20px}
.gamebox{display:flex;flex-direction:column;gap:12px;align-items:center;min-height:200px}
.gamebox>*{width:100%;max-width:820px}
.gcanvas{display:block;border-radius:18px;border:3px solid var(--line);touch-action:manipulation;max-width:100%;margin:0 auto}
.modegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.modeb{font:inherit;background:var(--surface);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.modeb span{font-size:36px}.modeb b{font-family:var(--display);font-size:17px}.modeb small{color:var(--muted);font-size:12px}
.modeb.locked{opacity:.55;cursor:default}
.archui{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.archui label{display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:14px}
.archui input[type=range]{width:100%;accent-color:var(--brand);height:30px}
.archui .big,.archui .archinfo{grid-column:1/-1}
.archinfo{margin:0;font-size:14px;color:var(--muted)}
.rdots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.rdots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.rdots i.ok{background:var(--ok)}.rdots i.no{background:var(--bad)}.rdots i.cur{background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.rbody{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:16px}

/* preguntas */
.modal{position:fixed;inset:0;z-index:50;background:rgba(19,17,43,.6);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal-box{background:var(--surface);color:var(--ink);border-radius:26px;padding:20px;width:min(100%,540px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;border:3px solid var(--brand);animation:tin .25s}
.modal-box.wide{width:min(100%,720px)}
body.noscroll{overflow:hidden}
.mtitle{font-size:26px}
.msub{margin:0;color:var(--muted)}
.mactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mactions.sticky{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px;border-radius:16px}
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qprog{margin-left:auto;font-weight:800;color:var(--muted)}
.qtext{font-size:21px;margin:0;line-height:1.3}
.qopts{display:grid;gap:8px}
.qopts.four{grid-template-columns:repeat(2,1fr)}
.qopt{font:inherit;font-size:17px;font-weight:700;text-align:left;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:52px}
.qopt small{color:var(--muted);font-weight:600}
.qopt:hover:not(:disabled){border-color:var(--brand)}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt:disabled{cursor:default}
.qfeed{display:flex;flex-direction:column;gap:8px}.qfeed:empty{display:none}
.okmsg{color:var(--ok);font-weight:800;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badmsg{color:var(--bad);font-weight:800;margin:0}
.expl{margin:0}
.qtimer{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.qtimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--accent))}
.result{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.resmedal{animation:pop .6s}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.1)}}
.bigemoji{font-size:64px}
.bigscore{font-size:22px;margin:0}.bigscore b{font-family:var(--display);font-size:48px;color:var(--brand)}
.lvlup{font-weight:800;color:#b45309;margin:0}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* vitrina */
.shelf h3{font-size:20px;margin-bottom:6px}
.shelfrow{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 10px;align-items:flex-end}
.shelfrow .item{flex:0 0 128px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.shelfrow .item b{font-size:13px;line-height:1.2}.shelfrow .item small{font-size:11px;color:var(--muted)}
.shelfrow.coins .item b{font-family:var(--display);font-size:26px}
.item.off{opacity:.6}
.plank{height:16px;border-radius:4px;background:linear-gradient(var(--shelf),var(--shelf2));box-shadow:0 6px 10px rgba(0,0,0,.15)}

/* avatar */
.aved{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:680px){.aved{grid-template-columns:1fr}.avprev{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4px);z-index:5}}
.avprev{background:linear-gradient(var(--brand-soft),var(--surface));border:3px solid var(--line);border-radius:24px;display:flex;justify-content:center;padding:10px}
.avprev{flex-direction:column;align-items:center;gap:6px}.avprev svg.avatar{width:150px;height:auto}.wallet{font-weight:800;display:flex;align-items:center;gap:4px;font-size:14px}
.avpanel{display:flex;flex-direction:column;gap:12px;min-width:0}
.avtabs{display:flex;gap:6px;flex-wrap:wrap}
.avtabs button{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.avtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.avrow{display:flex;flex-direction:column;gap:6px}
.avlabel{font-weight:800;font-size:14px;color:var(--muted)}
.avopts{display:flex;flex-wrap:wrap;gap:6px}
.op{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 12px;cursor:pointer}
.op.on{border-color:var(--brand);background:var(--brand-soft)}
.op small{font-size:11px;display:inline-flex;align-items:center;gap:2px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);cursor:pointer;font-size:14px;padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.op.lock,.sw.lock{opacity:.75}

/* taller */
.stepn{font-weight:800;color:var(--brand);margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.tbody{display:flex;flex-direction:column;gap:12px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.tcard{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tprev{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.tcard label,.tnames label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px}
.tcard input,.tnames input{padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.tnames{display:grid;gap:10px}.tnames.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.tnames label span{display:flex;align-items:center;gap:6px}
.tlab{font-weight:800;margin:0}
.symgrid{display:flex;flex-wrap:wrap;gap:6px}
.symb{width:46px;height:46px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer;display:grid;place-items:center}
.symb.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.ribgrid{display:flex;gap:8px;flex-wrap:wrap}
.shapegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.shapeb{font:inherit;font-weight:700;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.shapeb.on{border-color:var(--brand);background:var(--brand-soft)}
.final{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:14px}
.fi{display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;text-align:center}.fi small{font-size:11px;font-weight:700}

/* amigos */
.friends{display:flex;flex-direction:column;gap:8px}
.friend{display:grid;grid-template-columns:28px 48px 1fr auto auto auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 12px}
.friend.me{border-color:var(--brand);background:var(--brand-soft)}
.friend .pos{font-weight:800;color:var(--muted)}
@media (max-width:520px){.friend{grid-template-columns:24px 40px 1fr auto}.friend span:nth-of-type(n+3){display:none}}

/* detective */
.det{display:flex;flex-direction:column;gap:12px}
.dethead{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.pass{background:#1e3a8a;color:#e0e7ff;border-radius:14px;padding:8px 12px;flex:1;min-width:0}
.stamps{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stamp{border:2px dashed #93c5fd;color:#bfdbfe;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:800;transform:rotate(-3deg)}
.stamps.big .stamp{color:var(--brand);border-color:var(--brand);font-size:14px}
.days{font-weight:800;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px;white-space:nowrap}
.detcity{display:flex;gap:10px;align-items:center;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px}
.detcity .pin{font-size:34px}.detcity h3{font-size:22px}.detcity p{margin:2px 0 0}
.witness{background:#fef3c7;color:#422006;border-radius:6px 18px 18px 18px;padding:14px;box-shadow:0 5px 0 #f59e0b}
.witness ol{margin:6px 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.flight{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 0}
.plane{font-size:64px;animation:fly 1.3s ease-in-out}
@keyframes fly{0%{transform:translate(-120px,30px) rotate(10deg)}100%{transform:translate(120px,-30px) rotate(-10deg)}}
.det.end{text-align:center;align-items:center}

/* kiosco */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.prod{font:inherit;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.prod span{font-size:32px}.prod b{font-size:14px}.prod small{font-weight:800;color:var(--muted)}
.prod.on{border-color:var(--brand);background:var(--brand-soft)}
.cartline{font-weight:700;margin:0}
.bills{display:flex;flex-wrap:wrap;gap:6px}
.bill{font:inherit;font-weight:800;background:#d1fae5;color:#064e3b;border:2px solid #10b981;border-radius:8px;padding:10px 12px;cursor:pointer;min-width:84px}
.bill.coinb{background:#fef3c7;color:#78350f;border-color:#f59e0b;border-radius:99px;min-width:64px}
.chips{display:inline-flex;flex-wrap:wrap;gap:3px}.chips i{font-style:normal;font-size:12px;background:var(--brand-soft);border-radius:6px;padding:1px 5px}

/* ábaco */
.soroban{display:flex;justify-content:center;gap:6px;background:#7c2d12;border-radius:14px;padding:12px;width:fit-content;margin:0 auto;max-width:100%}
.rod{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;width:52px;background:linear-gradient(90deg,transparent 46%,#d6b48a 46%,#d6b48a 54%,transparent 54%)}
.bead{width:48px;height:24px;border-radius:50%;border:2px solid #451a03;background:#fbbf24;cursor:pointer;transition:transform .15s}
.bead.h{transform:translateY(-6px)}.bead.h.on{transform:translateY(8px);background:#ef4444}
.bead.e{transform:translateY(8px)}.bead.e.on{transform:translateY(-6px);background:#ef4444}
.beam{width:56px;height:6px;background:#f5f5f4;margin:6px 0}
.rod small{color:#fde68a;font-weight:800;margin-top:6px}
.abval{text-align:center;font-size:18px;margin:0}
.flashnum{font-family:var(--display);font-size:96px;text-align:center;min-height:120px;color:var(--brand)}

/* plato */
.plate{min-height:110px;border-radius:50%;background:radial-gradient(circle,#fff 55%,#e5e7eb 56%,#fff 70%);border:3px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding:18px;font-size:34px;width:min(100%,280px);aspect-ratio:1;margin:0 auto}
.plate em{font-size:13px;color:#6b7280;text-align:center}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.food{font:inherit;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.food span{font-size:28px}.food small{font-size:11px;font-weight:700}
.food.on{border-color:var(--brand);background:var(--brand-soft)}
.seqcards{display:flex;flex-direction:column;gap:6px}
.seqc{font:inherit;font-weight:700;text-align:left;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.seqc:disabled{opacity:.35}
.seqout,.tline{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:4px;font-weight:700;min-height:20px}
.tline li.ok{color:var(--ok)}.tline li.no{color:var(--bad)}

/* vial */
.vialbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.vialbtns .btn.on{background:var(--ok-soft);border-color:var(--ok)}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.sign{font:inherit;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sign small{font-size:11px;font-weight:700;text-align:center}
.sign.on{border-color:var(--brand)}.sign.done{opacity:.4}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.bin{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:3px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:96px}
.bin small{color:var(--muted);font-size:12px}
.inbin{display:flex;gap:3px;flex-wrap:wrap}
.corner{position:relative;height:200px;background:#86d36f;border-radius:16px;overflow:hidden}
.corner .road{position:absolute;background:#475569}
.corner .road.h{left:0;right:0;top:38%;height:24%}.corner .road.v{top:0;bottom:0;left:40%;width:20%}
.corner .ca,.corner .cb{position:absolute;font-size:40px}
.corner .ca{right:6%;top:39%}.corner .cb{left:6%;top:39%;transform:scaleX(-1)}

/* robot */
.robo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.robo{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px;aspect-ratio:1;max-width:360px;width:100%;margin:0 auto}
.grid span{background:var(--surface);border-radius:6px;display:grid;place-items:center;font-size:clamp(16px,5vw,28px);aspect-ratio:1}
.bot{display:inline-block;transition:transform .25s}
.blocks{display:flex;flex-wrap:wrap;gap:6px}
.blocks button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;background:#3b82f6;color:#fff}
.blocks button[data-b^="rep"],.blocks button[data-b="end"]{background:#f59e0b;color:#422006}
.blocks button[data-b="del"]{background:var(--line);color:var(--ink)}
.code{background:#1e1b4b;color:#e0e7ff;border-radius:12px;padding:10px 10px 10px 30px;margin:8px 0 0;min-height:60px;font-weight:700}
.code .rep{color:#fde68a}.code ol{padding-left:18px}.code .hint{color:#a5b4fc;list-style:none;margin-left:-20px}

/* inglés */
.bubble{background:var(--brand-soft);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.citymap{display:grid;grid-template-columns:repeat(calc(var(--n) + 1),1fr);gap:0;background:repeating-linear-gradient(0deg,transparent 0 calc(100%/5 - 6px),#94a3b8 calc(100%/5 - 6px) calc(100%/5)),repeating-linear-gradient(90deg,#d9f99d 0 calc(100%/5 - 6px),#94a3b8 calc(100%/5 - 6px) calc(100%/5));border-radius:12px;aspect-ratio:1;max-width:320px;width:100%;margin:0 auto}
.cn{display:grid;place-items:center;font-size:clamp(18px,6vw,28px)}

/* resiliencia */
.daily.calm{background:linear-gradient(135deg,#cffafe,#67e8f9);color:#083344;box-shadow:0 6px 0 #0891b2}
.growth{margin:0;background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:8px 10px;font-weight:700}
.overcome{margin:0;background:#fef3c7;color:#78350f;border-radius:12px;padding:8px 10px;font-weight:800;animation:pop .5s}
.breathe{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bcircle{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#a5f3fc,#0891b2);display:grid;place-items:center;color:#083344;font-weight:800;font-size:18px;transform:scale(.6);transition:transform 4s ease-in-out}
.bcircle.in{transform:scale(1)}.bcircle.hold{transform:scale(1)}.bcircle.out{transform:scale(.6)}
.feel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.feelb{font:inherit;background:var(--bg);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:80px}
.feelb span{font-size:32px}.feelb small{font-size:11px;font-weight:700}.feelb.on{border-color:var(--brand);background:var(--brand-soft)}
.charlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.charc{display:flex;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px}
.charc>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.charc small{color:var(--muted);font-size:12px}
.charico{font-size:36px;width:48px;text-align:center;filter:grayscale(1);opacity:.5}

.op.excl{border-color:#d4a017;background:linear-gradient(135deg,#fff7d1,#fde68a);color:#78350f}
.heroav svg{width:96px;height:auto}
.favw svg{width:34px;height:auto}
.friend{grid-template-columns:28px 40px 1fr auto auto auto}

.mono{display:inline-grid;place-items:center;width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--brand),#a855f7);color:#fde68a;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:48px;box-shadow:0 6px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.mono.sm{width:30px;height:30px;border-radius:9px;font-size:20px;box-shadow:none;vertical-align:middle;margin-right:4px}
.logo{display:flex;justify-content:center}
.by{display:block;font-family:var(--body);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.brand .by{display:inline;font-size:10px;margin-left:4px;letter-spacing:.12em}
.brand{display:flex;align-items:center;flex-wrap:wrap}
@media (max-width:680px){
  .avprev{flex-direction:row;justify-content:center;gap:12px;padding:4px 10px;border-radius:18px}
  .avprev svg.avatar{width:64px!important}
  .aved .mactions.sticky{position:static}
}

/* ===== v4: paleta violeta · rosa · verde ===== */
:root{--accent:#ec4899;--pink:#ec4899;--green:#10b981;--pink-soft:#fce7f3;--green-soft:#d1fae5}
.bar i{background:linear-gradient(90deg,#7c3aed,#ec4899,#10b981)}
.login{background:radial-gradient(circle at 12% 12%,#a78bfa66,transparent 38%),radial-gradient(circle at 88% 18%,#f9a8d466,transparent 36%),radial-gradient(circle at 50% 95%,#6ee7b766,transparent 40%),var(--bg)}
.login form{border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#7c3aed,#ec4899,#10b981) border-box;box-shadow:0 10px 30px #7c3aed22}
.login h1{background:linear-gradient(90deg,#6d28d9,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.login .by{color:#059669}
.logo{display:flex;justify-content:center;margin-bottom:-4px}
.crest{filter:drop-shadow(0 4px 6px #6d28d933)}
.crestb{display:inline-flex;margin-right:6px;vertical-align:middle}
.loginav{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--brand-soft),var(--pink-soft) 60%,var(--green-soft));border-radius:20px;padding:8px 12px;min-height:110px}
.loginav p{margin:0;font-weight:700;display:flex;flex-direction:column;gap:2px}.loginav p b{color:#be185d}.loginav small{color:var(--muted);font-weight:600;font-size:13px}
.lav{flex:0 0 auto;width:74px;display:flex;justify-content:center;border-radius:18px;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--me,#7c3aed) 30%,transparent),transparent 70%);animation:tin .4s}
.lav svg.avatar{width:62px!important;height:auto}
.lav.ghost{filter:grayscale(1) brightness(1.2);opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink-soft:#4a1d38;--green-soft:#0f3b2f}.loginav p b{color:#f9a8d4}}

/* errores: consecuencia + monito */
.miss{border:2px dashed var(--bad);border-radius:18px;padding:10px;background:var(--bad-soft);display:flex;flex-direction:column;gap:6px}
.missrow{display:flex;align-items:flex-end;justify-content:space-around;gap:8px}
.missav svg.avatar{width:64px!important;height:auto}
.missav .hscene{max-width:220px;height:auto}
.monkey{position:relative;display:flex;flex-direction:column;align-items:center;animation:monk .45s ease-in-out infinite alternate}
.mbubble{background:#fff;color:#7c2d12;border:2px solid #7c2d12;border-radius:14px;padding:3px 8px;font-weight:900;font-size:13px;white-space:nowrap;margin-bottom:2px}
@keyframes monk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
.misstxt{margin:0;font-weight:800}.cost{margin:0;font-weight:900;color:var(--bad);display:flex;align-items:center;gap:4px}
.strike{margin:0;font-weight:800;border-radius:12px;padding:6px 10px}.strike.s1{background:#fef3c7;color:#92400e}.strike.s2{background:#7f1d1d;color:#fff}
.heal{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:16px;padding:8px}.heal p{margin:0;font-weight:800}.heal svg.avatar{width:48px!important;height:auto}.heal .hscene{max-width:150px;height:auto}
.result.kicked .missrow{margin:6px 0}
.qtools{display:flex;justify-content:flex-end}
.btn.help{border-color:#f59e0b;background:#fffbeb;color:#92400e;display:inline-flex;align-items:center;gap:4px}
.qopt.gone{opacity:.25;text-decoration:line-through}

/* salud del plato */
.health{display:flex;gap:12px;align-items:center;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:8px 12px}
.health.s0{border-color:var(--ok)}.health.s4,.health.s5,.health.s6{border-color:var(--bad)}
.health .hav svg.avatar{width:58px!important;height:auto}.health .hav .hscene{width:170px;height:auto}.health .hav .labscene svg.avatar{width:50px!important}
.health b{font-family:var(--display);font-size:17px}.health small{color:var(--muted);display:block;font-size:13px}
.hsteps{display:flex;gap:4px;margin:4px 0}.hsteps i{width:22px;height:8px;border-radius:9px;background:var(--line)}.hsteps i.on{background:linear-gradient(90deg,#facc15,#ef4444)}.hsteps i:first-child.on{background:var(--ok)}
.labscene{display:flex;align-items:flex-end;gap:4px}
.diffl{margin-top:-6px}
.lblgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lbl{font:inherit;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.lbl.on{border-color:var(--brand)}.lbl .lico{font-size:34px}.octs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:56px;align-items:center}.octs em{color:var(--ok);font-weight:800}
.cubes{font-size:22px;letter-spacing:2px;text-align:center}

/* camino del saber */
.camino{font:inherit;color:var(--ink);text-align:left;border:3px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,#7c3aed,#ec4899,#10b981) border-box;border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.cam-top{display:flex;gap:10px;align-items:center}.cam-top b{display:block;font-family:var(--display);font-size:19px}.cam-top small{color:var(--muted)}
.cam-path{display:flex;gap:4px;align-items:center}.cam-path i{flex:1;height:12px;border-radius:9px;background:var(--line)}.cam-path i.done{background:linear-gradient(90deg,#7c3aed,#ec4899)}.cam-path i.cur{background:#10b981;box-shadow:0 0 0 3px var(--green-soft)}
.cam-next{color:var(--muted)}
.cam-list{list-style:none;padding:0;margin:0;display:grid;gap:6px;max-height:55vh;overflow:auto}.cam-list li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:6px 10px}.cam-list li.done{background:var(--brand-soft)}.cam-list li.cur{border-color:#10b981}.cam-list small{color:var(--muted)}

/* juegos bloqueados */
.gamecard{position:relative}.gamecard.locked{filter:grayscale(.8);opacity:.7}
.lockbadge{position:absolute;top:8px;right:8px;background:#1f2937;color:#fff;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}

/* detective */
.dethead{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
.wanted{background:#fef3c7;border:3px solid #92400e;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;transform:rotate(-2deg);color:#78350f}
.wanted small{font-weight:900;letter-spacing:.15em;font-size:11px}.wanted b{font-size:13px}.wanted svg.avatar{width:54px!important;height:auto}
.detinfo{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}.detinfo p{margin:0}
.chase{display:flex;align-items:center;gap:2px;background:var(--brand-soft);border-radius:14px;padding:4px 6px;overflow:hidden}
.cstep{flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--line);color:var(--muted)}.cstep.done{border-color:#ec4899}
.cdet svg.avatar,.cthief svg.avatar{width:22px!important;height:auto}
.capture{position:relative;height:340px;border-radius:24px;overflow:hidden;background:linear-gradient(#c4b5fd,#fbcfe8 60%,#a7f3d0)}
.cap-sky{position:absolute;bottom:60px;left:0;right:0;display:flex;justify-content:space-around;font-size:60px;opacity:.5}
.cap-thief,.cap-det{position:absolute;bottom:20px}.cap-thief svg.avatar,.cap-det svg.avatar{width:70px!important;height:auto}
.cap-thief{left:62%;animation:thiefrun 1.4s ease-out both}.cap-det{left:20%;animation:detrun 1.6s ease-out both}
@keyframes thiefrun{from{left:30%}to{left:62%}}
@keyframes detrun{from{left:-20%}to{left:38%}}
.cap-thief svg,.cap-det svg{animation:bob .25s ease-in-out 6 alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.cap-cage{position:absolute;left:calc(62% - 15px);bottom:14px;animation:cage .5s 1.4s cubic-bezier(.5,0,.9,.5) both}
@keyframes cage{from{transform:translateY(-420px)}to{transform:translateY(0)}}
.cap-title{position:absolute;top:16px;left:12px;right:12px;text-align:center;font-size:22px;color:#3b0764;animation:tin .5s 2s both}
.cap-sub{position:absolute;top:70px;left:12px;right:12px;text-align:center;font-weight:800;color:#831843;margin:0;animation:tin .5s 2.3s both}

/* ===== v5: profundidad ===== */
:root{--depth:color-mix(in srgb,var(--brand) 22%,#1e1b4b 10%);--lift:0 14px 28px -12px rgba(76,29,149,.38),0 4px 10px -4px rgba(76,29,149,.18)}
body{background:radial-gradient(1200px 600px at 10% -10%,#ddd6fe 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#fbcfe8 0%,transparent 55%),radial-gradient(900px 600px at 50% 120%,#bbf7d0 0%,transparent 60%),var(--bg);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(1200px 600px at 10% -10%,#3b2a7a 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#5b1d43 0%,transparent 55%),radial-gradient(900px 600px at 50% 120%,#0f4a37 0%,transparent 60%),var(--bg);background-attachment:fixed}}
.orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;animation:orb 22s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:260px;height:260px;background:#a78bfa;left:-60px;top:20%}
.orbs i:nth-child(2){width:220px;height:220px;background:#f472b6;right:-50px;top:45%;animation-duration:28s}
.orbs i:nth-child(3){width:240px;height:240px;background:#34d399;left:30%;bottom:-90px;animation-duration:25s}
@keyframes orb{to{transform:translate(60px,-40px) scale(1.15)}}
.view{perspective:900px}
.gamecard,.subj,.hero,.camino,.daily,.health,.det .detcity,.witness,.rbody,.shelf,.friend{box-shadow:var(--lift);transform-style:preserve-3d;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.gamecard,.subj{box-shadow:0 6px 0 color-mix(in srgb,var(--c,var(--brand)) 45%,transparent),var(--lift)}
.gamecard:hover,.subj:hover,.daily:hover,.camino:hover{transform:translateY(-4px);box-shadow:0 10px 0 color-mix(in srgb,var(--c,var(--brand)) 45%,transparent),0 22px 34px -14px rgba(76,29,149,.45)}
.gamecard:active,.subj:active,.daily:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c,var(--brand)) 45%,transparent),var(--lift)}
.gico,.sico{display:inline-block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));transform:translateZ(30px)}
.qopt{box-shadow:0 4px 0 var(--line);transition:transform .12s,box-shadow .12s}
.qopt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.qopt.right{box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,transparent)}.qopt.wrong{box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,transparent)}

.rb-gb i{font-style:normal;background:#fff;color:#111;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:12px;margin-left:4px}
.rb-intro{text-align:center}.rb-intro h3{margin:2px 0;font-family:var(--display);font-size:24px}.rb-intro p{text-align:left}
.rb-concept{text-align:center!important;font-weight:800;color:var(--wc)}
/* colores de bloques */
.k-mv{--bk:#3b82f6}.k-lp{--bk:#f59e0b}.k-cd{--bk:#8b5cf6}.k-fn{--bk:#ec4899}
.rb-gb.k-mv,.rb-gb.k-lp,.rb-gb.k-cd,.rb-gb.k-fn{background:var(--bk)}.rb-gb.k-lp{color:#422006}
/* nivel */
.rb-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rb-top b{font-family:var(--display);font-size:18px;flex:1}
.rb-goal{margin:6px 0 10px;font-weight:600}.rb-par{display:inline-block;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--wc) 18%,var(--surface));border-radius:10px;padding:2px 8px}
.rb-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:700px){.rb-main{grid-template-columns:1fr}}
.rb-board{display:flex;flex-direction:column;align-items:center;gap:8px}
.rb-tabs{display:flex;gap:6px}.rb-tabs button{font:inherit;font-weight:800;border:2px solid var(--wc);background:var(--surface);color:var(--ink);border-radius:10px;padding:4px 10px;cursor:pointer}
.rb-tabs button.on{background:var(--wc);color:#fff}
.rgrid{--cs:min(48px,calc((100vw - 56px)/var(--w)),calc(300px/var(--h)));display:grid;grid-template-columns:repeat(var(--w),var(--cs));grid-auto-rows:var(--cs);gap:3px;background:#94a3b8;padding:4px;border-radius:12px}
.rb-demo .rgrid{--cs:min(40px,calc(160px/var(--h)))}
.rgrid span{background:#f1f5f9;border-radius:6px;display:grid;place-items:center;font-size:calc(var(--cs)*.6);position:relative;line-height:1}
.rgrid span.w{background:#475569;background-image:linear-gradient(90deg,transparent 48%,#334155 48% 52%,transparent 52%),linear-gradient(transparent 48%,#334155 48% 52%,transparent 52%)}
.rgrid span.tr{background:#ddd6fe}.rgrid span.bad{background:#fecaca}
.rbot{position:relative;display:grid;place-items:center;width:100%;height:100%;transition:transform .2s}
.rbot i{font-style:normal}.rbot.jump{animation:rbJump .4s ease-out}
.rbot em{position:absolute;font-style:normal;font-size:calc(var(--cs)*.32);color:#7c3aed;font-weight:900;line-height:1;text-shadow:0 0 2px #fff,0 0 2px #fff}
.rbot em.d0{top:-2px;left:50%;transform:translateX(-50%)}.rbot em.d1{right:-1px;top:50%;transform:translateY(-50%)}
.rbot em.d2{bottom:-2px;left:50%;transform:translateX(-50%)}.rbot em.d3{left:-1px;top:50%;transform:translateY(-50%)}
.rbot small{position:absolute;right:0;bottom:0;font-size:calc(var(--cs)*.3)}
@keyframes rbJump{40%{transform:translateY(-35%) scale(1.15)}}
.rb-msg{min-height:2.6em;margin:0;text-align:center;font-weight:700;padding:6px 10px;border-radius:12px;background:var(--surface);border:2px solid var(--line);width:100%;box-sizing:border-box}
.rb-msg.ok{border-color:#22c55e;background:color-mix(in srgb,#22c55e 12%,var(--surface))}
.rb-msg.bad{border-color:#ef4444;background:color-mix(in srgb,#ef4444 10%,var(--surface))}
.rb-msg.tip{border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 12%,var(--surface))}
.rb-run,.rb-edit,.rb-help-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rb-pal{display:flex;flex-wrap:wrap;gap:6px}
.rb-pb{display:inline-flex;border-radius:12px;overflow:hidden;background:var(--bk);box-shadow:0 3px 0 color-mix(in srgb,var(--bk) 60%,#000)}
.rb-pb button{font:inherit;font-weight:800;border:0;background:transparent;color:#fff;cursor:pointer;padding:9px 10px}
.rb-pb.k-lp button{color:#422006}
.rb-pb .q{padding:9px 9px;background:rgba(255,255,255,.28);font-weight:900;border-left:1px solid rgba(0,0,0,.15)}
.rb-ptitle{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;gap:6px}
#rbCnt{font-size:13px;font-weight:800}#rbCnt.ok{color:#16a34a}#rbCnt.over{color:#d97706}
.rb-prog{list-style:none;margin:0;padding:8px;background:#1e1b4b;border-radius:14px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;gap:4px;counter-reset:rb}
.rb-prog.fn{background:#500724}
.rb-prog ol{list-style:none;margin:4px 0 2px 14px;padding:4px 0 4px 8px;border-left:4px solid var(--bk);display:flex;flex-direction:column;gap:4px}
.rb-prog li{color:#fff;font-weight:800}
.rb-b,.rb-h{background:var(--bk);border-radius:10px;padding:7px 10px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.k-lp>.rb-h,.rb-b.k-lp{color:#422006}
.rb-h2{color:#c4b5fd;font-weight:800;padding:2px 4px}
.rb-n,.rb-cnd{font:inherit;font-weight:900;border:2px solid rgba(0,0,0,.25);background:#fff;color:#111;border-radius:8px;padding:1px 8px;cursor:pointer}
.rb-prog.ro .rb-n,.rb-prog.ro .rb-cnd{display:inline-block}
.rb-caret{color:#c4b5fd!important;font-size:13px;border:2px dashed #a78bfa;border-radius:10px;padding:4px 8px;animation:rbBlink 1s steps(2) infinite}
@keyframes rbBlink{50%{opacity:.55}}
.rb-slot{color:#a5b4fc!important;font-size:13px;opacity:.75;padding:2px 8px;border-radius:8px;border:1px dashed #6366f1;align-self:flex-start}
.hi{outline:4px solid #facc15;outline-offset:1px}.hib{outline:4px solid #ef4444;outline-offset:1px;background:#ef4444!important;color:#fff!important}
.rb-lvl.running .rb-pal,.rb-lvl.running .rb-edit{opacity:.45;pointer-events:none}
.rb-tipline{margin:6px 0 0;font-size:13px}
.rb-prog.ro{cursor:default;min-height:0}
.rb-help h3{font-family:var(--display);margin:0 0 6px}.rb-how{margin:0 0 8px;padding-left:22px}.rb-how li{margin:3px 0}
.rb-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rb-cmp small{display:block;font-weight:800;margin-bottom:4px}
.rb-demo{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:center}.rb-demo>div:last-child{flex:1;min-width:150px}
.rb-win{text-align:center}.rb-bigstars{font-size:44px;letter-spacing:4px}.rb-medal{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.mini-money{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}.mini-money small{font-size:11px;font-weight:800}
.binsign{position:relative;display:inline-block;cursor:pointer;border-radius:8px;padding:2px}.binsign:hover{background:var(--line)}.binsign i{position:absolute;top:-4px;right:-4px;font-style:normal;font-size:10px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;font-weight:900}
#sgReset{margin:8px 0}

.kiosk-hero span{position:absolute;left:10px;bottom:10px;background:rgba(17,24,39,.78);color:#fff;font-weight:800;border-radius:12px;padding:4px 10px;font-size:14px}

.kmental.off{opacity:.5;text-decoration:line-through}
.kbonus{color:#15803d;font-weight:800}
.kcalc{margin:8px 0;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:6px 10px;max-width:320px}
.kcalc summary{cursor:pointer;font-weight:800}.kcalc summary small{font-weight:600;color:var(--muted)}
.kc-screen{margin:8px 0 6px;background:#1f2937;color:#a7f3d0;border-radius:10px;padding:6px 10px;text-align:right;font-family:ui-monospace,monospace;display:flex;flex-direction:column}
.kc-screen b{font-size:26px}.kc-op{min-height:16px;color:#94a3b8}
.kc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kc-keys button{font:inherit;font-size:20px;font-weight:800;border:0;border-radius:10px;padding:10px 0;background:var(--line);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.kc-keys button.op{background:#fde68a;color:#78350f}.kc-keys button.eq{background:#7c3aed;color:#fff}
.kc-keys button:active{transform:translateY(2px);box-shadow:none}
/* línea del tiempo */
.tl2{position:relative;margin:8px 0 12px;padding:4px 0}
.tl2-end{font-weight:800;font-size:13px;color:var(--muted);padding-left:6px}
.tl2-line{list-style:none;margin:6px 0;padding:0 0 0 22px;position:relative;display:flex;flex-direction:column;gap:8px}
.tl2-line::before,.tl2-real::before{content:"";position:absolute;left:13px;top:-6px;bottom:-6px;width:5px;border-radius:3px;background:linear-gradient(#a78bfa,#7c3aed)}
.tl2-line::after{content:"▼";position:absolute;left:8px;bottom:-16px;color:#7c3aed;font-size:14px}
.tl2-line li{display:flex;align-items:center;gap:8px;position:relative}
.tl2-dot{flex:none;width:24px;height:24px;margin-left:-22px;border-radius:50%;background:#7c3aed;color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;z-index:1;border:3px solid var(--surface)}
.tl2-empty{flex:1;border:2px dashed var(--line);border-radius:12px;padding:9px 12px;color:var(--muted);font-weight:700}
.tl2-ev{flex:1;font:inherit;font-weight:700;text-align:left;background:color-mix(in srgb,#7c3aed 12%,var(--surface));color:var(--ink);border:2px solid #7c3aed;border-radius:12px;padding:9px 12px;cursor:pointer;position:relative}
.tl2-ev i{font-style:normal;float:right;color:#ef4444;font-weight:900}
.tl2-real{position:relative;margin:6px 0;padding-left:22px}
.tl2-node{display:flex;align-items:center;gap:8px;font-weight:700;padding:4px 0}
.tl2-node b{color:#7c3aed;white-space:nowrap}.tl2-node small{color:var(--muted);font-weight:600}
.tl2-node.ok .tl2-dot{background:#16a34a}.tl2-node.no .tl2-dot{background:#ef4444}
.tl2-gap{display:flex;align-items:center}.tl2-gap span{font-size:12px;color:var(--muted);font-weight:700;margin-left:6px}
/* física */
.phys-c{background:color-mix(in srgb,#0ea5e9 10%,var(--surface));border-left:5px solid #0ea5e9;border-radius:10px;padding:6px 10px;margin:6px 0 10px;font-size:14px}
.phys-svg{display:flex;justify-content:center;margin:6px 0}
.roce{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.roce .lane{position:relative;height:40px;border-radius:10px;background:var(--c);border:2px solid rgba(0,0,0,.12)}
.roce .lane span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-weight:800;font-size:13px;color:#1f2937}
.roce .lane i{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-style:normal;font-size:22px;transition:left 1.6s cubic-bezier(.1,.7,.3,1)}
.tank{position:relative;height:190px;border:4px solid #64748b;border-top:0;border-radius:0 0 18px 18px;margin:10px 0;overflow:hidden;background:#f8fafc}
.tank .water{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(#7dd3fc,#2563eb)}
.fobj{position:absolute;top:6px;font:inherit;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:top 1.1s ease-in;width:15%;min-width:52px}
.fobj span{font-size:26px}.fobj small{font-size:10px;font-weight:800}
.fobj.up{top:30%}.fobj.down{top:calc(100% - 58px)}
.drop{position:relative;height:200px;background:linear-gradient(#e0f2fe,#f8fafc);border-radius:14px;margin:8px 0;overflow:hidden}
.drop .floor{position:absolute;left:0;right:0;bottom:0;height:10px;background:#a16207}
.dobj{position:absolute;top:6px;font-size:36px}
.tl2-node{flex-wrap:wrap}.tl2-node small{flex-basis:100%;padding-left:32px}
.roce .lane span{right:auto!important;left:8px}.roce .lane i{left:128px}
.fobj:disabled{opacity:1}

</style>

["mate",2,"¿Cuál es la fórmula del área de un triángulo?",["(Base × altura) ÷ 2","Base × altura","Base + altura + lado","Lado × 3"],"Un triángulo es la mitad de un rectángulo."],

["mate",2,"¿Qué estrategia usa 16 × 25 = 8 × 50 = 4 × 100?",["Dobles y mitades","Compensación","Redondeo hacia abajo","Resta iterativa"],"Se divide un factor por 2 y se duplica el otro: el resultado no cambia."],

function newProgress(){return {v:1,updated:0,avatar:null,rewards:null,xp:0,level:1,gold:0,silver:0,cash:0,cashV:2,

function needFor(L){return 80+40*(L-1)}
function levelInfo(xp){let L=1,a=0;while(xp>=a+needFor(L)){a+=needFor(L);L++}return {level:L,into:xp-a,need:needFor(L)}}

  if(o.cashV!==2){o.cash=Math.round((o.cash||0)*100);o.cashV=2}   // montos de hoy: todo lo ahorrado se multiplica por 100

const WAIT=[0,5*MIN,20*HOUR,3*DAY,7*DAY,15*DAY];
const mastered=s=>s&&s.bx>=3;
G.skill=s=>G.P.skill[s]??1.2;
G.subjectStats=function(s){const qs=QUESTIONS.filter(q=>q.s===s);const m=qs.filter(q=>mastered(G.P.srs[q.id])).length;return {total:qs.length,mastered:m,frac:qs.length?m/qs.length:0}};
G.due=function(s){const now=Date.now();return QUESTIONS.filter(q=>(!s||q.s===s)&&G.P.srs[q.id]&&G.P.srs[q.id].due<=now)};
G.recent=[];
/* elige pregunta: repasos que tocan + conceptos nuevos del nivel justo; evita repetir lo de los últimos días */
G.pickQ=function(s){
  const p=G.P,now=Date.now();const subj=s||pick(SUBJECTS).id;const sk=G.skill(subj);
  const lvl=clamp(Math.round(sk+(Math.random()-.5)*0.9),1,3);
  p.asked=p.asked||{};
  const fresh=q=>!G.recent.includes(q.id)&&(now-(p.asked[q.id]||0))>36*HOUR;
  const base=q=>q.s===subj&&!G.recent.includes(q.id);
  const due=QUESTIONS.filter(q=>base(q)&&p.srs[q.id]&&p.srs[q.id].due<=now&&q.l<=lvl+1);
  let pool=[];
  if(due.length&&Math.random()<0.4)pool=due;
  if(!pool.length)pool=QUESTIONS.filter(q=>base(q)&&q.l===lvl&&!p.srs[q.id]&&fresh(q));          // nuevas de su nivel
  if(!pool.length)pool=QUESTIONS.filter(q=>base(q)&&q.l<=lvl&&!mastered(p.srs[q.id])&&fresh(q));   // para afianzar
  if(!pool.length)pool=QUESTIONS.filter(q=>base(q)&&fresh(q));
  if(!pool.length)pool=QUESTIONS.filter(base);
  const q=pick(pool.length?pool:QUESTIONS.filter(x=>x.s===subj));
  G.recent.push(q.id);if(G.recent.length>25)G.recent.shift();
  p.asked[q.id]=now;const ks=Object.keys(p.asked);if(ks.length>900)ks.sort((x,y)=>p.asked[x]-p.asked[y]).slice(0,200).forEach(k=>delete p.asked[k]);
  return G.make(q);
};
G.make=function(q){let o;if(q.gen)o=q.gen.f();else o={q:q.q,opts:shuffle(q.opts),ans:q.opts[0],e:q.e};o.id=q.id;o.s=q.s;o.l=q.l;o.review=!!G.P.srs[q.id];return o};
/* registra la respuesta: ajusta la dificultad y el calendario de repaso. Devuelve {xp, silver} */
/* registra la respuesta: ajusta la dificultad y el calendario de repaso. Devuelve {xp, silver, overcame} */
G.answer=function(q,ok){
  const p=G.P,now=Date.now();p.stats.answered++;const d=today();p.stats.daily[d]=(p.stats.daily[d]||0)+1;
  Object.keys(p.stats.daily).sort().slice(0,-30).forEach(k=>delete p.stats.daily[k]);
  const dd=p.stats.dayRes||(p.stats.dayRes={});dd[d]=dd[d]||[0,0];dd[d][1]++;if(ok)dd[d][0]++;Object.keys(dd).sort().slice(0,-30).forEach(k=>delete dd[k]);
  if(q.s){const sk=G.skill(q.s);p.skill[q.s]=clamp(ok?sk+0.1*(q.l>=sk?1.4:0.6):sk-0.15,1,3.4)}
  let overcame=false;if(typeof G.steps==="function")G.steps();
  if(q.id){let s=p.srs[q.id];if(!s)s=p.srs[q.id]={bx:0,due:now};
    if(ok){if(!s.ok){s.ok=1;G.stepUp&&G.stepUp()}
      if(s.wrong&&!s.fixed){s.fixed=true;overcame=true;p.stats.overcome=(p.stats.overcome||0)+1}
      if(s.due<=now||s.bx===0)s.bx=Math.min(5,s.bx+1);s.due=now+WAIT[s.bx]}
    else{s.wrong=(s.wrong||0)+1;s.fixed=false;s.bx=Math.max(0,s.bx-2);s.due=now+3*MIN}}
  if(q.l===3)p.stats.hardTried=(p.stats.hardTried||0)+1;
  if(ok){p.stats.correct++;const c=G.earn((PAY.answer[q.l]||2500)+(overcame?PAY.overcome:0));return {xp:6+q.l*2+(overcame?5:0),cents:c,overcame}}
  return {xp:1,cents:0,overcame:false};   // el costo en monedas lo cobra UI.miss
};

G.addXP=function(xp,cents=0){
  const p=G.P,before=levelInfo(p.xp).level;p.xp=Math.max(0,p.xp+Math.round(xp));G.earn(cents);
  if(xp>0)G.touchStreak();
  const after=levelInfo(p.xp).level;if(after>before){const c=G.earn(PAY.level*(after-before));setTimeout(()=>{FX.toast(`⬆️ ¡Nivel ${after}! +${fmtM(c)}`);SND.play("muybien",.9,true);FX.fanfare();FX.confetti(140)},700)}
  G.checkAwards();G.save();
};
G.touchStreak=function(){
  const s=G.P.streak,t=today();if(s.last===t)return;
  if(s.last===dayBefore(t))s.count++;
  else if(s.last&&s.shields>0&&s.last===dayBefore(dayBefore(t))){s.shields--;s.count++;FX.toast("🛡️ Tu escudo salvó la racha")}
  else s.count=1;
  s.last=t;s.best=Math.max(s.best,s.count);
  if(s.count%7===0&&s.shields<2){s.shields++;setTimeout(()=>FX.toast("🛡️ ¡Ganaste un escudo de racha!"),1200)}
  G.earn(Math.min(PAY.streakMax,s.count*10000));
};
G.streakNow=function(){const s=G.P.streak;if(!s.last)return 0;const t=today();if(s.last===t||s.last===dayBefore(t))return s.count;if(s.shields>0&&s.last===dayBefore(dayBefore(t)))return s.count;return 0};
/* medalla por partida según porcentaje */
G.medalFor=(pct,th)=>{th=th||{gold:.9,silver:.7,bronze:.5};return pct>=th.gold-1e-9?"gold":pct>=th.silver-1e-9?"silver":pct>=th.bronze-1e-9?"bronze":null};
G.gameDone=function(id,correct,total,extra={}){
  const g=G.P.games[id]||(G.P.games[id]={plays:0,best:0,lvl:1,medals:{bronze:0,silver:0,gold:0}});
  const pct=total?correct/total:0;const m=G.medalFor(pct,extra.th);
  g.plays++;g.best=Math.max(g.best,Math.round(pct*100));let up=false;
  if(m){g.medals[m]++;G.P.medals[m]++}
  if(m==="gold"){g.lvl++;up=true}else if(pct<(extra.down||0.4)&&g.lvl>1&&(extra.allowDown!==false)){g.lvl--}
  const xp=correct*5+Math.min(5,total-correct)+(m==="gold"?20:m==="silver"?12:m==="bronze"?6:0);   // intentar también suma
  const cents=m?PAY.medal[m]:0;
  G.addXP(xp,cents);
  return {medal:m,up,xp,cents,lvl:g.lvl,pct,th:extra.th};
};

const FX={
  audio(){if(!this.ac){try{this.ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return this.ac},
  tone(f,d=.12,t="sine",v=.15,dl=0){const ac=this.audio();if(!ac||G.mute)return;const s=ac.currentTime+dl;const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)},
  good(){this.tone(660,.1,"triangle");this.tone(990,.16,"triangle",.15,.08);if(typeof SND!=="undefined")SND.good()},
  bad(){this.tone(180,.25,"sawtooth",.07)},
  coin(){this.tone(988,.07,"square",.05);this.tone(1319,.14,"square",.05,.06)},
  pop(){this.tone(520,.06,"triangle",.08)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.18,"triangle",.12,i*.11))},
  shake(el){el=el||document.getElementById("stage");if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")},
  parts:[],
  confetti(n=80,x,y){const c=document.getElementById("fx");if(!c)return;if(matchMedia("(prefers-reduced-motion: reduce)").matches)n=Math.min(n,15);
    x=x??innerWidth/2;y=y??innerHeight/3;const cols=["#7c3aed","#f59e0b","#10b981","#ec4899","#3b82f6","#facc15"];
    for(let i=0;i<n;i++)this.parts.push({x,y,vx:(Math.random()-.5)*12,vy:Math.random()*-12-2,g:.35,s:rnd(4,9),c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+rnd(0,60)});
    if(!this.run){this.run=true;requestAnimationFrame(()=>this.loop())}},
  sparkle(x,y,col="#facc15",n=16){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=2+Math.random()*4;this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.05,s:rnd(3,6),c:col,r:0,vr:.2,life:40+rnd(0,20),star:true})}
    if(!this.run){this.run=true;requestAnimationFrame(()=>this.loop())}},
  loop(){const c=document.getElementById("fx"),x=c.getContext("2d");const dpr=devicePixelRatio||1;
    if(c.width!==Math.round(innerWidth*dpr)){c.width=Math.round(innerWidth*dpr);c.height=Math.round(innerHeight*dpr)}
    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,innerWidth,innerHeight);this.parts=this.parts.filter(p=>p.life>0);
    this.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.r+=p.vr;p.life--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.life/30);x.fillStyle=p.c;
      if(p.star){x.beginPath();for(let i=0;i<5;i++){x.lineTo(Math.cos(i*1.256)*p.s,Math.sin(i*1.256)*p.s);x.lineTo(Math.cos(i*1.256+.628)*p.s/2.4,Math.sin(i*1.256+.628)*p.s/2.4)}x.fill()}else x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(this.parts.length)requestAnimationFrame(()=>this.loop());else{this.run=false;x.clearRect(0,0,innerWidth,innerHeight)}},
  toast(t){const b=document.getElementById("toasts");if(!b)return;const el=document.createElement("div");el.className="gtoast";el.textContent=t;b.appendChild(el);while(b.children.length>4)b.firstChild.remove();setTimeout(()=>el.classList.add("out"),2800);setTimeout(()=>el.remove(),3300)}
};

const others=(arr,keyFn,cur,n=3)=>shuffle(arr.filter(x=>keyFn(x)!==keyFn(cur))).map(keyFn).filter((v,i,a)=>a.indexOf(v)===i).slice(0,n);
const yr=y=>y<0?`${-y} a. C.`:String(y);
const century=y=>{if(y<0)return null;const c=Math.floor((y-1)/100)+1;const R=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX","XXI","XXII","XXIII"];return "siglo "+R[c]};
const DATA_GEN=[];
function dgen(id,s,l,list,f){list.forEach((row,i)=>DATA_GEN.push({id:`d.${id}.${i}`,s,l:typeof l==="function"?l(row):l,f:()=>f(row)}))}
dgen("capital","geografia",1,COUNTRIES,c=>mk(`¿Cuál es la capital de ${c[0]}?`,c[1],others(COUNTRIES,x=>x[1],c),`La capital de ${c[0]} es ${c[1]}.`));

dgen("contin","geografia",1,COUNTRIES,c=>mk(`¿En qué continente está ${c[0]}?`,c[2],["América","Europa","Asia","África","Oceanía"].filter(x=>x!==c[2]).sort(()=>Math.random()-.5).slice(0,3),`${c[0]} está en ${c[2]}.`));

dgen("siglo","historia",3,BIG_EVENTS.filter(e=>e[0]>100),e=>{const c=century(e[0]);const n=Math.floor((e[0]-1)/100)+1;const R=x=>century(x*100);return mk(`${e[1]} (${e[0]}). ¿En qué siglo fue?`,c,[R(n-1),R(n+1),R(n+2)].filter(Boolean),`Del año ${(n-1)*100+1} al ${n*100} es el ${c}.`)});

/* ---------- pregunta ---------- */
UI.ask=function(q,opt={}){
  UI.lastQ=q;
  return new Promise(res=>{
    const s=SUBJ_BY[q.s];
    const b=UI.modal(`<div class="qhead">${s?`<span class="chip" style="--c:${s.color}">${s.icon} ${s.name}</span>`:""}<span class="chip lv">${LVL_NAME[q.l]||""}</span>${q.review?`<span class="chip rev">🔁 Repaso</span>`:""}${opt.progress?`<span class="qprog">${opt.progress}</span>`:""}</div>
      ${opt.timer?`<div class="qtimer"><i id="qbar"></i></div>`:""}
      ${opt.pic?`<div class="qpic">${opt.pic}</div>`:""}<h3 class="qtext">${esc(q.q)}</h3><div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}" data-v="${esc(o)}" type="button">${esc(o)}</button>`).join("")}</div><div class="qtools" id="qtools"></div><div id="qfeed" class="qfeed"></div>`);
    let done=false,t0=performance.now(),raf;
    const hb=UI.helpBtn(b,q);if(hb){$("qtools").innerHTML=hb;$("qhelp").onclick=()=>{if(UI.useHelp(b,q.ans))$("qhelp").remove()}}
    const fin=i=>{if(done)return;done=true;cancelAnimationFrame(raf);const ok=i!=null&&q.opts[i]===q.ans;
      if($("qhelp"))$("qhelp").remove();
      b.querySelectorAll(".qopt").forEach((el,j)=>{el.disabled=true;if(q.opts[j]===q.ans)el.classList.add("right");else if(j===i)el.classList.add("wrong")});
      const r=G.answer(q,ok);const m=ok?null:UI.miss({what:"Pregunta: "+q.q,ms:i==null?99999:performance.now()-t0,words:(q.q+" "+q.opts.join(" ")).split(/\s+/).length});const heal=ok?UI.hit():"";
      if(ok){FX.good();const rc=b.querySelector(".qopt.right").getBoundingClientRect();FX.sparkle(rc.left+rc.width/2,rc.top+rc.height/2)}else{FX.bad();FX.shake(b)}
      $("qfeed").innerHTML=`${r.overcame?`<p class="overcome">🦁 ¡Lo superaste! Esta antes te había costado.</p>`:""}<p class="${ok?"okmsg":"badmsg"}">${ok?pick(["¡Bien!","¡Excelente!","¡Eso es!","¡Genial!"]):i==null?"Se terminó el tiempo.":"Esta no era."} ${ok?plus(r.cents)+(q.l===3?` <span class="dtag">🔥 pregunta difícil: paga más</span>`:q.l===1?` <span class="dtag easy">fácil</span>`:""):""}</p><p class="expl">${esc(q.e||"")}</p>${heal}${m?m.html:""}<button class="btn primary" id="qnext" type="button">${m&&m.out?"Salir del juego":"Seguir"}</button>`;
      if(r.overcame){FX.fanfare();FX.confetti(70)}
      $("qnext").focus();$("qnext").onclick=()=>{UI.close();if(m&&m.out){UI.kickOut();return}res({ok,xp:r.xp})}};
    b.querySelectorAll(".qopt").forEach(el=>el.onclick=()=>fin(+el.dataset.i));
    if(opt.timer){const bar=$("qbar");const tick=()=>{const f=1-(performance.now()-t0)/(opt.timer*1000);bar.style.width=Math.max(0,f*100)+"%";if(f<=0)fin(null);else raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)}
  });
};
/* sesión de preguntas con "revancha": lo que sale mal vuelve 2 o 3 preguntas después */
UI.quiz=async function(title,n,subj,id,opt={}){
  if(G.lockLeft(id)){FX.toast(`🔒 Bloqueado: faltan ${fmtLeft(G.lockLeft(id))}. Jugá a otra cosa.`);return}
  UI.startSession(id,{noLock:id==="examen"});
  let ok=0,k=0,again=[],revOk=0;
  while(k<n||again.length){
    let q,rev=false;
    const ready=again.find(a=>a.at<=k||k>=n);
    if(ready){again=again.filter(a=>a!==ready);q=G.make(ready.c);q.revancha=true;rev=true}
    else{q=G.pickQ(subj||null);k++}
    const r=await UI.ask(q,{progress:rev?"🔁 Revancha":`${k}/${n}`,timer:opt.timer});
    if(rev){if(r.ok){revOk++;FX.toast("🦁 ¡Revancha ganada!")}continue}
    if(r.ok)ok++;else{const c=QUESTIONS.find(x=>x.id===q.id);if(c)again.push({c,at:k+rnd(2,3)})}
  }
  const daily=id==="desafio"&&G.P.stats.dailyDone!==today();
  if(daily)G.P.stats.dailyDone=today();
  const res=G.gameDone(id,ok,n,{allowDown:false});
  if(daily){G.earn(PAY.daily);G.save()}
  if(revOk){G.earn(revOk*PAY.revancha);G.save()}
  const extra=[daily?`+${fmtM(PAY.daily)} por el desafío del día.`:"",revOk?`🦁 Ganaste ${revOk} revancha${revOk>1?"s":""}: +${fmtM(revOk*PAY.revancha)}.`:""].filter(Boolean).join(" ");
  UI.cur=null;
  if(opt.after)return opt.after(ok,n,res,extra);
  UI.result(title,ok,n,res,extra,()=>UI.show(UI.view==="play"?"inicio":UI.view));
};

      if(can)$("avPay").onclick=()=>{G.spend(cost);UI.close();FX.coin();done()}};
  };
  const apply=(k,v,type)=>{if(type!=="multi"&&JSON.stringify(a[k])===JSON.stringify(v))return false;   // tocar lo que ya está elegido no cuenta como cambio

/* =====================================================================
   SALAS DE "MEMORIA EN EQUIPO" — reglas compartidas
   El mismo código corre en la hoja de Google (Codigo.gs) y en el juego
   (para practicar con robots sin internet).
   ===================================================================== */
var ROOM = {
  MAXP: 8, TURN_MS: 25000, SHOW_MS: 1700, AWAY_MS: 40000, FREEZE_MAX: 30000, MAX_CARDS: 60, LETTERS: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
  newCode: function () { var s = ''; for (var i = 0; i < 4; i++) s += ROOM.LETTERS[Math.floor(Math.random() * ROOM.LETTERS.length)]; return s; },
  err: function (m) { var e = new Error(m); e.room = true; throw e; },
  create: function (code, u, name, av, now) {
    return { code: code, v: 1, host: u, status: 'lobby', players: [{ u: u, name: name, av: av, score: 0, last: now, pairs: [], at: 0 }],
      deck: [], done: {}, flips: [], turn: 0, turnAt: now, pend: 0, freeze: 0, frzLeft: 0, frz: 0, emo: [], topic: '', last: null, created: now, ends: 0 };
  },
  touch: function (st, u, now) { var p = ROOM.player(st, u); if (p) p.last = now; },
  player: function (st, u) { for (var i = 0; i < st.players.length; i++) if (st.players[i].u === u) return st.players[i]; return null; },
  join: function (st, u, name, av, now) {
    var p = ROOM.player(st, u);
    if (p) { p.last = now; p.av = av || p.av; p.name = name || p.name; p.left = false; st.v++; return st; }
    if (st.status !== 'lobby') ROOM.err('La partida ya empezó. Esperá a que termine o pedí una sala nueva.');
    if (st.players.length >= ROOM.MAXP) ROOM.err('La sala está llena (máximo ' + ROOM.MAXP + ').');
    st.players.push({ u: u, name: name, av: av, score: 0, last: now, pairs: [], at: 0 }); st.v++; return st;
  },
  leave: function (st, u, now) {
    var i = -1; for (var k = 0; k < st.players.length; k++) if (st.players[k].u === u) i = k;
    if (i < 0) return st;
    if (st.status === 'lobby') { st.players.splice(i, 1); if (st.host === u && st.players.length) st.host = st.players[0].u; }
    else { st.players[i].left = true; if (st.turn === i && st.status === 'play') ROOM.pass(st, now); }
    st.v++; return st;
  },
  start: function (st, u, deck, topic, now) {
    if (u !== st.host) ROOM.err('Solo quien creó la sala puede empezar.');
    if (st.status !== 'lobby') ROOM.err('La partida ya empezó.');
    if (!deck || deck.length < 4 || deck.length > ROOM.MAX_CARDS) ROOM.err('Mazo inválido.');
    st.deck = deck; st.topic = topic || ''; st.status = 'play'; st.done = {}; st.flips = []; st.pend = 0; st.freeze = 0; st.frz = 0; st.last = null;
    st.players.forEach(function (p) { p.score = 0; p.pairs = []; p.at = 0; });
    st.turn = Math.floor(Math.random() * st.players.length); st.turnAt = now; st.v++; return st;
  },
  again: function (st, u, now) {
    if (u !== st.host) ROOM.err('Solo quien creó la sala puede armar otra partida.');
    st.status = 'lobby'; st.deck = []; st.done = {}; st.flips = []; st.pend = 0; st.freeze = 0; st.last = null;
    st.players = st.players.filter(function (p) { return !p.left; }); st.v++; return st;
  },
  active: function (st, i, now) { var p = st.players[i]; return p && !p.left && (now - p.last) < ROOM.AWAY_MS; },
  next: function (st, now) {
    var n = st.players.length;
    for (var k = 1; k <= n; k++) { var j = (st.turn + k) % n; if (ROOM.active(st, j, now)) return j; }
    return st.turn;
  },
  pass: function (st, now) { st.flips = []; st.pend = 0; st.freeze = 0; st.frz = 0; st.turn = ROOM.next(st, now); st.turnAt = now; },
  tick: function (st, now) {
    if (st.status !== 'play') return st;
    if (st.freeze) { if (now - st.freeze < ROOM.FREEZE_MAX) return st; st.freeze = 0; st.turnAt = now - (ROOM.TURN_MS - st.frzLeft); st.v++; }
    if (st.pend && now >= st.pend) { ROOM.pass(st, now); st.v++; }
    else if (!st.pend && now - st.turnAt > ROOM.TURN_MS) {
      var who = st.players[st.turn]; ROOM.pass(st, now);
      st.last = { ok: false, timeout: true, name: who ? who.name : '' }; st.v++;
    }
    return st;
  },
  flip: function (st, u, i, now) {
    ROOM.tick(st, now);
    if (st.status !== 'play') ROOM.err('La partida no está en juego.');
    var cur = st.players[st.turn];
    if (!cur || cur.u !== u) ROOM.err('Esperá tu turno.');
    if (st.pend) ROOM.err('Esperá que se den vuelta las cartas.');
    if (st.freeze) { st.freeze = 0; st.turnAt = now - (ROOM.TURN_MS - st.frzLeft); }
    i = Number(i);
    if (!(i >= 0 && i < st.deck.length) || st.done[i] != null) ROOM.err('Esa carta ya está descubierta.');
    if (st.flips.indexOf(i) >= 0) return st;                       // el mismo toque repetido no cuenta
    st.flips.push(i); st.turnAt = Math.max(st.turnAt, now - ROOM.TURN_MS + 8000); st.v++;
    if (st.flips.length === 2) {
      var a = st.flips[0], b = st.flips[1];
      if (st.deck[a].p === st.deck[b].p) {
        st.done[a] = st.turn; st.done[b] = st.turn; cur.score++; cur.at = now; cur.pairs.push(st.deck[a].p); st.flips = []; st.turnAt = now;
        st.last = { ok: true, a: a, b: b, name: cur.name, u: cur.u, e: st.deck[a].e || '' };
        var all = true; for (var k = 0; k < st.deck.length; k++) if (st.done[k] == null) { all = false; break; }
        if (all) { st.status = 'end'; st.ends = now; }
      } else {
        st.pend = now + ROOM.SHOW_MS; st.last = { ok: false, a: a, b: b, name: cur.name, u: cur.u };
      }
    }
    return st;
  },
  /* comodín: el reloj se frena mientras responde una pregunta */
  freezeOn: function (st, u, now) {
    ROOM.tick(st, now); var cur = st.players[st.turn];
    if (st.status !== 'play' || !cur || cur.u !== u || st.pend) ROOM.err('Solo en tu turno.');
    if (st.frz >= 2) ROOM.err('Ya usaste 2 comodines en este turno.');
    if (!st.freeze) { st.freeze = now; st.frzLeft = Math.max(0, ROOM.TURN_MS - (now - st.turnAt)); st.frz++; st.v++; }
    return st;
  },
  freezeOff: function (st, u, ok, now) {
    var cur = st.players[st.turn];
    if (!cur || cur.u !== u || !st.freeze) return st;
    st.freeze = 0; st.turnAt = ok ? now : now - (ROOM.TURN_MS - st.frzLeft); st.v++; return st;
  },
  emote: function (st, u, e, now) {
    var p = ROOM.player(st, u); if (!p) return st;
    st.emo.push({ id: now + '' + Math.floor(Math.random() * 1000), u: u, name: p.name, e: String(e).slice(0, 40), t: now }); if (st.emo.length > 12) st.emo.shift(); st.v++; return st;
  },
  view: function (st, u, now) {
    var me = -1; for (var k = 0; k < st.players.length; k++) if (st.players[k].u === u) me = k;
    return {
      code: st.code, v: st.v, status: st.status, host: st.host === u, topic: st.topic, me: me, turn: st.turn, frozen: !!st.freeze, frz: st.frz,
      turnLeft: st.status !== 'play' ? 0 : st.freeze ? st.frzLeft : Math.max(0, ROOM.TURN_MS - (now - st.turnAt)), pend: !!st.pend,
      players: st.players.map(function (p, i) { return { name: p.name, av: p.av, score: p.score, at: p.at, away: !ROOM.active(st, i, now), left: !!p.left }; }),
      cards: st.deck.map(function (c, i) {
        return { s: st.done[i] != null ? 'done' : st.flips.indexOf(i) >= 0 ? 'up' : 'down', t: c.t, k: c.k, by: st.done[i] != null ? st.done[i] : -1 };
      }),
      last: st.last, emo: st.emo.filter(function (x) { return now - x.t < 8000; })
    };
  }
};
if (typeof module !== 'undefined') module.exports = ROOM;

const toV=([la,lo])=>{const a=la*Math.PI/180,b=lo*Math.PI/180;return [Math.cos(a)*Math.cos(b),Math.cos(a)*Math.sin(b),Math.sin(a)]};
const toLL=v=>{const r=Math.hypot(...v);return [Math.asin(v[2]/r)*180/Math.PI,Math.atan2(v[1],v[0])*180/Math.PI]};

function vehicleFor(a,b,km,last){
  if(last)return ["🚁","helicóptero"];

    if(km<800)return pick([["🚌","micro"],["🚗","auto"]]);
    if(a.c==="Europa"&&km<2600)return ["🚄","tren de alta velocidad"];
    if(a.c==="Asia"&&km<2600)return ["🚅","tren bala"];
    if(a.c==="Oceanía")return ["🛳️","barco"];
    if(a.c==="África"&&km<3500)return ["🚙","jeep por la sabana"];
    if(a.c==="América del Sur"&&km<2600)return pick([["🚌","micro de larga distancia"],["🚂","tren"]]);
  }

  if(km<2600)return ["⛴️","ferry"];
  if(SEA.includes(sea(a,b))&&Math.random()<0.25)return ["🛳️","barco por el océano"];
  return ["✈️","avión"];
}
/* globo 3D: gira de una ciudad a otra mostrando el viaje */
function globeTrip(box,from,to,veh,info,done){
  box.innerHTML=`<div class="trip"><canvas id="globe" aria-label="Viaje de ${esc(from.n)} a ${esc(to.n)}"></canvas><p class="tripline"><b>${veh[0]} En ${esc(veh[1])}</b> de ${esc(from.n)} a ${esc(to.n)}<br><small>${info}</small></p></div>`;
  const c=$("globe"),ctx=c.getContext("2d");const S=Math.min(box.clientWidth,340),r=devicePixelRatio||1;c.width=S*r;c.height=S*r;c.style.width=c.style.height=S+"px";ctx.setTransform(r,0,0,r,0,0);
  const A=GEO[from.n]||[0,0],B=GEO[to.n]||[0,0];const pa=toV(A),pb=toV(B);const R=S*0.42,cx=S/2,cy=S/2;const t0=performance.now(),DUR=2600;let raf;
  const proj=(ll,c0)=>{const [la,lo]=ll.map(x=>x*Math.PI/180);const [la0,lo0]=c0.map(x=>x*Math.PI/180);
    const cosc=Math.sin(la0)*Math.sin(la)+Math.cos(la0)*Math.cos(la)*Math.cos(lo-lo0);
    let x=Math.cos(la)*Math.sin(lo-lo0),y=Math.cos(la0)*Math.sin(la)-Math.sin(la0)*Math.cos(la)*Math.cos(lo-lo0);
    if(cosc<0){const m=Math.hypot(x,y)||1;x/=m;y/=m}return [cx+x*R,cy-y*R,cosc>=0]};
  const frame=now=>{
    const tt=Math.min(1,(now-t0)/DUR);const e=tt<.5?2*tt*tt:1-Math.pow(-2*tt+2,2)/2;
    const camV=slerp(pa,pb,e);const cam=toLL(camV);cam[0]=clamp(cam[0]*0.8,-60,60);
    ctx.clearRect(0,0,S,S);
    // halo y océano con luz
    const halo=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.18);halo.addColorStop(0,"rgba(167,139,250,.55)");halo.addColorStop(1,"rgba(167,139,250,0)");ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,R*1.18,0,7);ctx.fill();
    const sea=ctx.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);sea.addColorStop(0,"#7dd3fc");sea.addColorStop(.6,"#2563eb");sea.addColorStop(1,"#1e3a8a");ctx.fillStyle=sea;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
    // paralelos y meridianos
    ctx.strokeStyle="rgba(255,255,255,.18)";ctx.lineWidth=1;
    for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();let pen=false;for(let lo=-180;lo<=180;lo+=6){const [x,y,v]=proj([lat,lo],cam);if(v){pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true}else pen=false}ctx.stroke()}
    for(let lo=-180;lo<180;lo+=30){ctx.beginPath();let pen=false;for(let lat=-90;lat<=90;lat+=6){const [x,y,v]=proj([lat,lo],cam);if(v){pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true}else pen=false}ctx.stroke()}
    // tierra
    LAND.forEach(poly=>{const pts=[];for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];for(let k=0;k<4;k++){const ll=toLL(slerp(toV(p),toV(q),k/4));pts.push(proj(ll,cam))}}
      if(!pts.some(p=>p[2]))return;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
      const g=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,"#86efac");g.addColorStop(1,"#15803d");ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(20,83,45,.5)";ctx.stroke()});
    // ruta
    ctx.setLineDash([5,5]);ctx.strokeStyle="#fde68a";ctx.lineWidth=2.5;ctx.beginPath();let pen=false;
    for(let k=0;k<=40;k++){const ll=toLL(slerp(pa,pb,k/40));const [x,y,v]=proj(ll,cam);if(v){pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true}else pen=false}ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle="#ec4899";ctx.lineWidth=3.5;ctx.beginPath();pen=false;for(let k=0;k<=40*e;k++){const ll=toLL(slerp(pa,pb,k/40));const [x,y,v]=proj(ll,cam);if(v){pen?ctx.lineTo(x,y):ctx.moveTo(x,y);pen=true}else pen=false}ctx.stroke();
    [[A,from.n],[B,to.n]].forEach(([ll,n])=>{const [x,y,v]=proj(ll,cam);if(!v)return;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.fillStyle="#db2777";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.lineWidth=3;ctx.strokeStyle="rgba(30,27,75,.8)";ctx.strokeText(n,x,y-10);ctx.fillStyle="#fff";ctx.fillText(n,x,y-10)});
    // vehículo
    const [vx,vy]=proj(toLL(slerp(pa,pb,e)),cam);const lift=Math.sin(e*Math.PI)*(veh[0]==="✈️"||veh[0]==="🚁"?14:3);
    // hacia dónde avanza en la pantalla: el vehículo mira para ese lado
    const [nx,ny]=proj(toLL(slerp(pa,pb,Math.min(1,e+0.02))),cam),[bx,by]=proj(toLL(slerp(pa,pb,Math.max(0,e-0.02))),cam);
    const ang=Math.atan2(ny-by,nx-bx);
    ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(vx,vy+4,10,4,0,0,7);ctx.fill();
    ctx.save();ctx.translate(vx,vy-lift);ctx.font=`26px ${EMOJI}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#000";
    if(veh[0]==="✈️")ctx.rotate(ang+Math.PI/4);            // el avión del emoji apunta en diagonal hacia arriba a la derecha
    else{const right=Math.cos(ang)>0;if(right){ctx.scale(-1,1);ctx.rotate(-clamp(ang,-.5,.5))}else{let r=ang-Math.PI;if(r<-Math.PI)r+=2*Math.PI;ctx.rotate(clamp(r,-.5,.5))}}   // los demás emojis miran a la izquierda: se dan vuelta si va a la derecha
    ctx.fillText(veh[0],0,0);ctx.restore();ctx.textBaseline="alphabetic";
    ctx.restore();
    // brillo de esfera (profundidad)
    const shine=ctx.createRadialGradient(cx-R*.45,cy-R*.5,0,cx-R*.45,cy-R*.5,R*.9);shine.addColorStop(0,"rgba(255,255,255,.35)");shine.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=shine;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    const shade2=ctx.createRadialGradient(cx+R*.3,cy+R*.35,R*.3,cx,cy,R);shade2.addColorStop(0,"rgba(15,23,42,0)");shade2.addColorStop(1,"rgba(15,23,42,.35)");ctx.fillStyle=shade2;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    if(tt<1)raf=requestAnimationFrame(frame);else setTimeout(()=>{if(!UI.ended)done()},500)};
  raf=requestAnimationFrame(frame);FX.tone(400,.3,"sine",.06);
  const old=UI.cleanup;UI.cleanup=()=>{cancelAnimationFrame(raf);old&&old()};
}
